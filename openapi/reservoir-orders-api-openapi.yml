tags:
- name: Orders
paths:
  /orders/asks/v5:
    get:
      summary: Asks (listings)
      operationId: getOrdersAsksV5
      description: 'Get a list of asks (listings), filtered by token, collection or maker. This API is designed for efficiently ingesting large volumes of orders, for external processing.


        To get all orders unflitered, select `sortBy` to `updatedAt`. No need to pass any other param. This will return any orders for any collections, token, attribute, etc.


        Please mark `excludeEOA` as `true` to exclude Blur orders.'
      parameters:
      - x-alternatives:
        - type: array
          items:
            type: string
          collectionFormat: multi
          name: ids
        - type: string
        name: ids
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: 'Filter to a particular token. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`'
        x-convert:
          case: lower
        name: token
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      - description: Filter to a particular set, e.g. `contract:0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`
        name: tokenSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular user. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
        x-convert:
          case: lower
        name: maker
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection set. Requires `maker` to be passed. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: Filter to a particular contracts set.
        x-convert:
          case: lower
        name: contractsSetId
        in: query
        schema:
          type: string
      - x-alternatives:
        - type: array
          maxItems: 80
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          collectionFormat: multi
          name: contracts
        - type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        name: contracts
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          maxItems: 80
      - description: "When only `id` is passed, orders with any status are returned. When passing `id`, status can be filtered using the possible values: `active`, `inactive`, `expired`, `cancelled`, or `filled`.\n When only `maker` is passed, orders with active statuses are returned. When passing `maker`, status can be filtered using the possible values: `active`, `inactive`, `expired`, `cancelled`, and `filled`.\n When only `contracts` is passed, orders with active statuses are returned. When `contracts` and `sortBy=updatedAt` are passed, orders with any status are returned. When passing `contracts`, status can be filtered using the possible value of `active` only."
        name: status
        in: query
        schema:
          type: string
      - x-alternatives:
        - type: array
          maxItems: 80
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          collectionFormat: multi
          name: sources
        - type: string
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
        name: sources
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          maxItems: 80
      - description: If true, results will filter only Reservoir orders.
        name: native
        in: query
        schema:
          type: boolean
      - description: If true, private orders are included in the response.
        name: includePrivate
        in: query
        schema:
          type: boolean
      - description: If true, criteria metadata is included in the response. defaults to **false**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: If true, raw data is included in the response. defaults to **false**
        name: includeRawData
        in: query
        schema:
          type: boolean
      - description: If true, dynamic pricing data will be returned in the response. defaults to **false**
        name: includeDynamicPricing
        in: query
        schema:
          type: boolean
      - description: Exclude orders that can only be filled by EOAs, to support filling with smart contracts. defaults to **false**
        name: excludeEOA
        in: query
        schema:
          type: boolean
      - x-alternatives:
        - type: array
          maxItems: 80
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          collectionFormat: multi
          name: excludeSources
        - type: string
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
        name: excludeSources
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          maxItems: 80
      - description: Get events after a particular unix timestamp (inclusive)
        name: startTimestamp
        in: query
        schema:
          type: number
      - description: Get events before a particular unix timestamp (inclusive)
        name: endTimestamp
        in: query
        schema:
          type: number
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Order the items are returned in the response. Sorting by `price` is ascending order only. defaults to **createdAt**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - price
          - updatedAt
      - x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max limit is 1000. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - description: Return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Orders
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getOrdersAsksV4Response'
      x-order: 5
  /orders/bids/v6:
    get:
      summary: Bids (offers)
      operationId: getOrdersBidsV6
      description: 'Get a list of bids (offers), filtered by token, collection or maker. This API is designed for efficiently ingesting large volumes of orders, for external processing.


        There are a different kind of bids than can be returned:


        - To get all orders unfiltered, select `sortBy` to `updatedAt`. No need to pass any other param. This will return any orders for any collections, token, attribute, etc.


        - Inputting a ''contract'' will return token and attribute bids.


        - Inputting a ''collection-id'' will return collection wide bids.


        - Please mark `excludeEOA` as `true` to exclude Blur orders.'
      parameters:
      - x-alternatives:
        - type: array
          items:
            type: string
          collectionFormat: multi
          name: ids
        - type: string
        name: ids
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: 'Filter to a particular token. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`'
        x-convert:
          case: lower
        name: token
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      - description: 'Filter to a particular set. Example: `token:CONTRACT:TOKEN_ID` representing a single token within contract, `contract:CONTRACT` representing a whole contract, `range:CONTRACT:START_TOKEN_ID:END_TOKEN_ID` representing a continuous token id range within a contract and `list:CONTRACT:TOKEN_IDS_HASH` representing a list of token ids within a contract.'
        name: tokenSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular user. Must set `sources=blur.io` to reveal maker''s blur bids. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
        x-convert:
          case: lower
        name: maker
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection set. Requires `maker` to be passed. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: Filter to a particular contracts set.
        x-convert:
          case: lower
        name: contractsSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection bids with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular attribute. Note: Our docs do not support this parameter correctly. To test, you can use the following URL in your browser. Example: `https://api.reservoir.tools/orders/bids/v5?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attribute[Type]=Original` or `https://api.reservoir.tools/orders/bids/v5?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attribute[Type]=Original&attribute[Type]=Sibling`(Collection must be passed as well when filtering by attribute)'
        name: attribute
        in: query
        x-type: object
        schema:
          type: string
      - description: 'Filter to an array of contracts. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-alternatives:
        - type: array
          description: 'Filter to an array of contracts. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          maxItems: 80
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          collectionFormat: multi
          name: contracts
        - type: string
          description: 'Filter to an array of contracts. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        name: contracts
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          maxItems: 80
      - description: "When only `id` is passed, orders with any status are returned. When passing `id`, status can be filtered using the possible values: `active`, `inactive`, `expired`, `cancelled`, or `filled`.\n When only `maker` is passed, orders with active statuses are returned. When passing `maker`, status can be filtered using the possible values: `active`, `inactive`, `expired`, `cancelled`, and `filled`.\n When only `contracts` is passed, orders with active statuses are returned. When `contracts` and `sortBy=updatedAt` are passed, orders with any status are returned. When passing `contracts`, status can be filtered using the possible value of `active` only."
        name: status
        in: query
        schema:
          type: string
      - x-alternatives:
        - type: array
          maxItems: 80
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          collectionFormat: multi
          name: sources
        - type: string
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
        name: sources
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          maxItems: 80
      - description: Filter to a particular order type. Must be one of `token`, `collection`, `attribute`, `custom`. Only valid when a maker is specified.
        name: orderType
        in: query
        schema:
          type: string
          enum:
          - token
          - collection
          - attribute
          - custom
      - description: If true, results will filter only Reservoir orders.
        name: native
        in: query
        schema:
          type: boolean
      - description: If true, private orders are included in the response.
        name: includePrivate
        in: query
        schema:
          type: boolean
      - description: If true, criteria metadata is included in the response. defaults to **false**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: If true, raw data is included in the response. Set `sources=blur.io` and make this `true` to reveal individual blur bids. defaults to **false**
        name: includeRawData
        in: query
        schema:
          type: boolean
      - description: If true, the depth of each order is included in the response. defaults to **false**
        name: includeDepth
        in: query
        schema:
          type: boolean
      - description: Get events after a particular unix timestamp (inclusive)
        name: startTimestamp
        in: query
        schema:
          type: number
      - description: Get events before a particular unix timestamp (inclusive)
        name: endTimestamp
        in: query
        schema:
          type: number
      - description: Exclude orders that can only be filled by EOAs, to support filling with smart contracts. defaults to **false**
        name: excludeEOA
        in: query
        schema:
          type: boolean
      - x-alternatives:
        - type: array
          maxItems: 80
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          collectionFormat: multi
          name: excludeSources
        - type: string
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
        name: excludeSources
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          maxItems: 80
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Order the items are returned in the response. Sorting by `price` defaults sorting direction to descending.  defaults to **createdAt**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - price
          - updatedAt
      - x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max limit is 1000. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - description: Return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Orders
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getOrdersBidsV5Response'
      x-order: 5
  /orders/depth/v1:
    get:
      summary: Orders depth
      operationId: getOrdersDepthV1
      description: Get the depth of a token or collection.
      parameters:
      - x-convert:
          case: lower
        name: side
        in: query
        required: true
        schema:
          type: string
          enum:
          - buy
          - sell
      - description: 'Filter to a particular token. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`.'
        x-convert:
          case: lower
        name: token
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      - description: 'Filter to a particular collection. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`.'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular attributes within a collection (Relevant only for buy orders). Example: `attributes[Mouth]=Bored` (Collection must be passed as well when filtering by attributes)'
        name: attributes
        in: query
        x-type: object
        schema:
          type: string
      - description: Return all prices in this currency.
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: Return all prices in this currency.
        name: groupByFloorAsk
        in: query
        schema:
          type: boolean
      - description: Number of decimals by which to group by the orders defaults to **4**
        name: precision
        in: query
        schema:
          type: number
          minimum: 1
          maximum: 8
      tags:
      - Orders
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getOrdersDepthV1Response'
      x-order: 5
components:
  schemas:
    Model195:
      type: array
      items:
        $ref: '#/components/schemas/Model194'
    depth:
      type: array
      items:
        $ref: '#/components/schemas/Model196'
    Model123:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/Model121'
        collection:
          $ref: '#/components/schemas/Model122'
    Model122:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        isSpam:
          type: boolean
        isNsfw:
          type: boolean
    Model193:
      type: object
      properties:
        kind:
          type: string
          enum:
          - dutch
        data:
          $ref: '#/components/schemas/Model192'
    getOrdersDepthV1Response:
      type: object
      properties:
        depth:
          $ref: '#/components/schemas/depth'
    getOrdersAsksV4Response:
      type: object
      properties:
        orders:
          $ref: '#/components/schemas/Model198'
        continuation:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
    price:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/currency'
        amount:
          $ref: '#/components/schemas/amount'
        netAmount:
          $ref: '#/components/schemas/netAmount'
    time:
      type: object
      properties:
        start:
          type: number

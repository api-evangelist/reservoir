openapi: 3.0.0
security:
- API_KEY: []
info:
  title: Reservoir API
  version: 5.296.1
  description: You are viewing the reference docs for the Reservoir API.        For a more complete overview with guides and examples, check out the <a href='https://reservoirprotocol.github.io'>Reservoir Protocol Docs</a>.
x-alt-definitions:
  data:
    type: object
    properties:
      collectionId:
        type: string
      collectionName:
        type: string
      tokenName:
        type: string
      image:
        type: string
  metadata:
    type: object
    properties:
      kind:
        type: string
        enum:
        - token
      data:
        $ref: '#/x-alt-definitions/data'
  Model1:
    type: object
    properties:
      collectionId:
        type: string
      collectionName:
        type: string
      image:
        type: string
  Model2:
    type: object
    properties:
      kind:
        type: string
        enum:
        - collection
      data:
        $ref: '#/x-alt-definitions/Model1'
  Model3:
    type: object
    properties:
      key:
        type: string
      value:
        type: string
    required:
    - value
  attributes:
    type: array
    items:
      $ref: '#/x-alt-definitions/Model3'
  Model4:
    type: object
    properties:
      collectionId:
        type: string
      collectionName:
        type: string
      attributes:
        $ref: '#/x-alt-definitions/attributes'
      image:
        type: string
  Model5:
    type: object
    properties:
      kind:
        type: string
        enum:
        - attribute
      data:
        $ref: '#/x-alt-definitions/Model4'
  token:
    type: object
    properties:
      tokenId:
        type: string
        pattern: ^-?[0-9]+$
      name:
        type: string
      image:
        type: string
      isSpam:
        type: boolean
      isNsfw:
        type: boolean
  collection:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      image:
        type: string
      isSpam:
        type: boolean
      isNsfw:
        type: boolean
  Model6:
    type: object
    properties:
      token:
        $ref: '#/x-alt-definitions/token'
      collection:
        $ref: '#/x-alt-definitions/collection'
  criteria:
    type: object
    properties:
      kind:
        type: string
        enum:
        - token
      data:
        $ref: '#/x-alt-definitions/Model6'
  Model7:
    type: object
    properties:
      collection:
        $ref: '#/x-alt-definitions/collection'
  Model8:
    type: object
    properties:
      kind:
        type: string
        enum:
        - collection
      data:
        $ref: '#/x-alt-definitions/Model7'
  Model9:
    type: object
    properties:
      collection:
        $ref: '#/x-alt-definitions/collection'
      attribute:
        $ref: '#/x-alt-definitions/Model3'
  Model10:
    type: object
    properties:
      kind:
        type: string
        enum:
        - attribute
      data:
        $ref: '#/x-alt-definitions/Model9'
  Model11:
    type: object
    properties:
      tokenSetId:
        type: string
  Model12:
    type: object
    properties:
      kind:
        type: string
        enum:
        - custom
      data:
        $ref: '#/x-alt-definitions/Model11'
  Model13:
    type: object
    properties:
      collectionName:
        type: string
      tokenName:
        type: string
      image:
        type: string
  Model14:
    type: object
    properties:
      kind:
        type: string
        enum:
        - token
      data:
        $ref: '#/x-alt-definitions/Model13'
  Model15:
    type: object
    properties:
      collectionName:
        type: string
      image:
        type: string
  Model16:
    type: object
    properties:
      kind:
        type: string
        enum:
        - collection
      data:
        $ref: '#/x-alt-definitions/Model15'
  Model17:
    type: object
    properties:
      collectionName:
        type: string
      attributes:
        $ref: '#/x-alt-definitions/attributes'
      image:
        type: string
  Model18:
    type: object
    properties:
      kind:
        type: string
        enum:
        - attribute
      data:
        $ref: '#/x-alt-definitions/Model17'
  currency:
    type: object
    properties:
      contract:
        type: string
        pattern: ^0x[a-fA-F0-9]{40}$
      name:
        type: string
      symbol:
        type: string
      decimals:
        type: number
      chainId:
        type: number
  amount:
    type: object
    description: Amount with fees & royalties included.
    properties:
      raw:
        type: string
        pattern: ^-?[0-9]+$
      decimal:
        type: number
      usd:
        type: number
      native:
        type: number
  netAmount:
    type: object
    description: Amount with fees & royalties removed.
    properties:
      raw:
        type: string
        pattern: ^-?[0-9]+$
      decimal:
        type: number
      usd:
        type: number
      native:
        type: number
  start:
    type: object
    properties:
      currency:
        $ref: '#/x-alt-definitions/currency'
      amount:
        $ref: '#/x-alt-definitions/amount'
      netAmount:
        $ref: '#/x-alt-definitions/netAmount'
  price:
    type: object
    properties:
      start:
        $ref: '#/x-alt-definitions/start'
      end:
        $ref: '#/x-alt-definitions/start'
  time:
    type: object
    properties:
      start:
        type: number
      end:
        type: number
  Model19:
    type: object
    properties:
      price:
        $ref: '#/x-alt-definitions/price'
      time:
        $ref: '#/x-alt-definitions/time'
  dynamicPricing:
    type: object
    properties:
      kind:
        type: string
        enum:
        - dutch
      data:
        $ref: '#/x-alt-definitions/Model19'
  prices:
    type: array
    items:
      $ref: '#/x-alt-definitions/start'
  Model20:
    type: object
    properties:
      pool:
        type: string
      prices:
        $ref: '#/x-alt-definitions/prices'
  Model21:
    type: object
    properties:
      kind:
        type: string
        enum:
        - pool
      data:
        $ref: '#/x-alt-definitions/Model20'
  Model22:
    type: object
    properties:
      fromBlock:
        type: number
      toBlock:
        type: number
      blockRange:
        type: number
    required:
    - fromBlock
    - toBlock
  Model23:
    type: object
    properties:
      kind:
        type: string
        enum:
        - all
      data:
        $ref: '#/x-alt-definitions/Model22'
  Model24:
    type: object
    properties:
      contract:
        type: string
        pattern: ^0x[a-fA-F0-9]{40}$
      fromTimestamp:
        type: number
      toTimestamp:
        type: number
      timestampRange:
        type: number
    required:
    - contract
    - fromTimestamp
    - toTimestamp
  Model25:
    type: object
    properties:
      kind:
        type: string
        enum:
        - contract
      data:
        $ref: '#/x-alt-definitions/Model24'
  Model26:
    type: object
    properties:
      txHash:
        type: string
        pattern: ^0x[a-fA-F0-9]{64}$
    required:
    - txHash
  Model27:
    type: object
    properties:
      kind:
        type: string
        enum:
        - transaction
      data:
        $ref: '#/x-alt-definitions/Model26'
  events:
    type: array
    items:
      type: string
  eventsType:
    type: array
    items:
      type: string
      enum:
      - ftTransferEvents
  syncDetails:
    type: object
    properties:
      method:
        type: string
        enum:
        - events
      events:
        $ref: '#/x-alt-definitions/events'
      eventsType:
        $ref: '#/x-alt-definitions/eventsType'
  Model28:
    type: object
    properties:
      method:
        type: string
        enum:
        - address
      address:
        type: string
        pattern: ^0x[a-fA-F0-9]{40}$
  collections:
    type: array
    description: 'Array of collection ids to disable metadata for. Max limit is 50. Example: `collections[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63 collections[1]: 0x521f9c7505005cfa19a8e5786a9c3c9c9f5e6f42`'
    maxItems: 50
    items:
      type: string
      x-convert:
        case: lower
  Model29:
    type: array
    description: 'Update to one or more collections. Max limit is 50. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
    minItems: 1
    maxItems: 50
    items:
      type: string
      x-convert:
        case: lower
  exactOrderSource:
    type: array
    maxItems: 2
    items:
      type: string
      pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
      x-convert:
        case: lower
  ids:
    type: array
    description: 'Array of order ids to invalidate. Max limit is 50. Example: `ids[0]: 0x505b35e849bccbd787bf670b3e85577fa5c2814cfa0ecab50867e4dc5b5362d4 ids[1]: 0xd0e83bdeb5b79352d4a3657387d1e438e9df68d773bb3b3c88da41948ef48188`'
    maxItems: 50
    items:
      type: string
  tokens:
    type: array
    description: 'Array of tokens to disable or reenable metadata for. Max limit is 50. Example: `tokens[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens[1]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
    maxItems: 50
    items:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      x-convert:
        case: lower
  Model30:
    type: array
    description: 'Array of tokens. Max limit is 50. Example: `tokens[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens[1]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
    maxItems: 50
    items:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      x-convert:
        case: lower
  Model31:
    type: array
    description: 'Array of tokens to refresh. Max limit is 50. Example: `tokens[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens[1]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
    maxItems: 50
    items:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      x-convert:
        case: lower

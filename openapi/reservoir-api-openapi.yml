      properties:
        seaport-v1.4:
          $ref: '#/components/schemas/seaport-v1.4'
        seaport-v1.5:
          $ref: '#/components/schemas/seaport-v1.4'
        seaport-v1.6:
          $ref: '#/components/schemas/seaport-v1.4'
        mintify:
          $ref: '#/components/schemas/seaport-v1.4'
        payment-processor-v2:
          $ref: '#/components/schemas/payment-processor-v2'
        payment-processor-v2.1:
          $ref: '#/components/schemas/payment-processor-v2'
    Model535:

paths:
  /api-keys/{key}/rate-limits:
    get:
      summary: Get rate limits for the given API key
      operationId: getApikeysKeyRatelimits
      description: 'Get the rate limits for the given API key. Note: API keys are not universal across all available chains; please make a different key for every chain.'
      parameters:
      - description: The API key
        x-format:
          guid: true
        name: key
        in: path
        required: true
        schema:
          type: string
      tags:
      - Management
      - marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Model115'
  /chain/stats/v1:
    get:
      summary: Chain Stats
      operationId: getChainStatsV1
      description: Get chain mint and sales stats for 1 and 7 days
      tags:
      - Chain
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getChainStatsV5Response'
      x-order: 3
  /collections-sets/v1:
    post:
      summary: Create collection set
      operationId: postCollectionssetsV1
      description: 'Array of collections to gather in a set. Adding or removing a collection will change the response. You may use this set when `collectionSetId` is an available param. The max limit of collection in an array is 500. An example is below.


        `"collections": "0xba30E5F9Bb24caa003E9f2f0497Ad287FDF95623", "0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D"`


        `"collectionsSetId": "8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65"`'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model502'
      tags:
      - Collections
      - marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postCreateCollectionsSetV1Response'
      x-order: 13
  /collections-sets/{collectionsSetId}/owners-distribution/v1:
    get:
      summary: Owners Collection Set Distribution
      operationId: getCollectionssetsCollectionssetidOwnersdistributionV1
      description: This API can be used to show what the distribution of owners in a collections set id looks like.
      parameters:
      - description: 'Filter to a particular collections set. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Owners
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getCollectionsSetOwnersDistributionV1Response'
      x-order: 6
  /collections/activity/v6:
    get:
      summary: Collection activity
      operationId: getCollectionsActivityV6
      description: This API can be used to build a feed for a collection including sales, asks, transfers, mints, bids, cancelled bids, and cancelled asks types.
      parameters:
      - description: 'Filter to a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: Filter to a particular collection set.
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular attribute. Note: Our docs do not support this parameter correctly. To test, you can use the following URL in your browser. Example: `https://api.reservoir.tools/collections/activity/v6?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attribute[Type]=Original` or `https://api.reservoir.tools/collections/activity/v6?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attribute[Type]=Original&attribute[Type]=Sibling`'
        name: attributes
        in: query
        x-type: object
        schema:
          type: string
      - description: If true, will filter any activities marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any activities marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: Amount of items returned. Max limit is 50. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      - description: Order the items are returned in the response. The blockchain event time is `eventTimestamp`. The event time recorded is `createdAt`. defaults to **eventTimestamp**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - eventTimestamp
          - createdAt
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
      - description: If true, metadata is included in the response. If true, max limit is 50. defaults to **true**
        name: includeMetadata
        in: query
        schema:
          type: boolean
      - x-alternatives:
        - type: array
          items:
            type: string
            enum:
            - ask
            - bid
            - mint
            - sale
            - ask_cancel
            - bid_cancel
            - transfer
            x-convert:
              case: lower
          collectionFormat: multi
          name: types
        - type: string
          enum:
          - ask
          - bid
          - mint
          - sale
          - ask_cancel
          - bid_cancel
          - transfer
          x-convert:
            case: lower
        name: types
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ask
            - bid
            - mint
            - sale
            - ask_cancel
            - bid_cancel
            - transfer
            x-convert:
              case: lower
      - description: Input any ERC20 address to return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Activity
      - marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getCollectionActivityV6Response'
      x-order: 1
  /collections/daily-volumes/v1:
    get:
      summary: Daily collection volume
      operationId: getCollectionsDailyvolumesV1
      description: Get date, volume, rank and sales count for each collection
      parameters:
      - description: 'Filter to a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: id
        in: query
        required: true
        schema:
          type: string
      - description: Amount of items returned in response. defaults to **60**
        name: limit
        in: query
        schema:
          type: number
      - description: The start timestamp you want to filter on (UTC)
        name: startTimestamp
        in: query
        schema:
          type: number
      - description: The end timestamp you want to filter on (UTC)
        name: endTimestamp
        in: query
        schema:
          type: number
      tags:
      - Stats
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getDailyVolumesV1Response'
      x-order: 7
  /collections/disable-metadata/v1:
    post:
      summary: Disable or reenable metadata for a collection
      operationId: postCollectionsDisablemetadataV1
      description: This API requires an allowed API key for execution. Please contact technical support with more questions.
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model524'
      tags:
      - Management
      - marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/putSetCollectionCommunityV1Response'
      x-order: 13
  /collections/nsfw-status/v1:
    post:
      summary: Update collections nsfw status
      operationId: postCollectionsNsfwstatusV1
      description: This API can be used by allowed API keys to update the nsfw status of a collection.
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:

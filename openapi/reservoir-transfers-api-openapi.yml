tags:
- name: Transfers
paths:
  /transfers/bulk/v2:
    get:
      summary: Bulk historical transfers
      operationId: getTransfersBulkV2
      description: 'Note: this API is optimized for bulk access, and offers minimal filters/metadata. If you need more flexibility, try the `NFT API > Transfers` endpoint'
      parameters:
      - description: 'Filter to a particular contract. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: contract
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: 'Filter to a particular token. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`'
        x-convert:
          case: lower
        name: token
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      - description: Get events after a particular unix timestamp (inclusive)
        name: startTimestamp
        in: query
        schema:
          type: number
      - description: Get events before a particular unix timestamp (inclusive)
        name: endTimestamp
        in: query
        schema:
          type: number
      - x-alternatives:
        - type: array
          maxItems: 80
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{64}$
            x-convert:
              case: lower
          collectionFormat: multi
          name: txHash
        - type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          x-convert:
            case: lower
        name: txHash
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{64}$
            x-convert:
              case: lower
          maxItems: 80
      - description: Amount of items returned in response. Max limit is 1000. defaults to **100**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - description: Order the items are returned in the response. Options are `timestamp`, and `updatedAt`. Default is `timestamp`.
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - timestamp
          - updatedAt
      - x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      tags:
      - Transfers
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Model264'
      x-order: 10
components:

tags:
- name: x-deprecated
paths:
  /collections/trending-mints/v1:
    get:
      summary: Top Trending Mints
      operationId: getCollectionsTrendingmintsV1
      description: Get top trending mints
      parameters:
      - description: Time window to aggregate. defaults to **24h**
        name: period
        in: query
        schema:
          type: string
          enum:
          - 5m
          - 10m
          - 30m
          - 1h
          - 2h
          - 6h
          - 24h
      - description: The type of the mint (free/paid). defaults to **any**
        name: type
        in: query
        schema:
          type: string
          enum:
          - free
          - paid
          - any
      - description: Amount of items returned in response. Default is 50 and max is 50. Expected to be sorted and filtered on client side. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - x-alternatives:
        - type: array
          maxItems: 20
          items:
            type: string
          collectionFormat: multi
          name: mintStandard
        - type: string
        name: mintStandard
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 20
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: If true, return the non flagged floor ask. Supported only when `normalizeRoyalties` is false. defaults to **false**
        name: useNonFlaggedFloorAsk
        in: query
        schema:
          type: boolean
      tags:
      - x-deprecated
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/get-trending-mintsV1Response'
      x-order: 3
      deprecated: true
  /events/asks/v3:
    get:
      summary: Asks status changes
      operationId: getEventsAsksV3
      description: 'Every time an ask status changes, an event is generated. This API is designed to be polled at high frequency, in order to keep an external system in sync with accurate prices for any token.


        There are multiple event types, which describe what caused the change in price:


        - `new-order` > new listing at a lower price


        - `expiry` > the previous best listing expired


        - `sale` > the previous best listing was filled


        - `cancel` > the previous best listing was canceled


        - `balance-change` > the best listing was invalidated due to no longer owning the NFT


        - `approval-change` > the best listing was invalidated due to revoked approval


        - `revalidation` > manual revalidation of orders (e.g. after a bug fixed)


        - `reprice` > price update for dynamic orders (e.g. dutch auctions)


        - `bootstrap` > initial loading of data, so that all tokens have a price associated


        Note: Private listings (asks) will not appear in the results.'
      parameters:
      - description: 'Filter to a particular contract. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: contract
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: Get events after a particular unix timestamp (inclusive)
        name: startTimestamp
        in: query
        schema:
          type: number
      - description: Get events before a particular unix timestamp (inclusive)
        name: endTimestamp
        in: query
        schema:
          type: number
      - description: If true, criteria metadata is included in the response. defaults to **false**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: Order the items are returned in the response. defaults to **desc**
        name: sortDirection
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max is 1000 defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Input any ERC20 address to return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - x-deprecated
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getAsksEventsV3Response'
      deprecated: true
  /events/bids/v3:
    get:
      summary: Bid status changes
      operationId: getEventsBidsV3
      description: 'Every time a bid status changes, an event is generated. This API is designed to be polled at high frequency, in order to keep an external system in sync with accurate prices for any token.


        There are multiple event types, which describe what caused the change in price:


        - `new-order` > new offer at a lower price


        - `expiry` > the previous best offer expired


        - `sale` > the previous best offer was filled


        - `cancel` > the previous best offer was canceled


        - `balance-change` > the best offer was invalidated due to no longer owning the NFT


        - `approval-change` > the best offer was invalidated due to revoked approval


        - `revalidation` > manual revalidation of orders (e.g. after a bug fixed)


        - `reprice` > price update for dynamic orders (e.g. dutch auctions)


        - `bootstrap` > initial loading of data, so that all tokens have a price associated


        Some considerations to keep in mind


        - Selling a partial quantity of available 1155 tokens in a listing will generate a `sale` and will have a new quantity.


        - Due to the complex nature of monitoring off-chain liquidity across multiple marketplaces, including dealing with block re-orgs, events should be considered ''relative'' to the perspective of the indexer, ie _when they were discovered_, rather than _when they happened_. A more deterministic historical record of price changes is in development, but in the meantime, this method is sufficent for keeping an external system in sync with the best available prices.'
      parameters:
      - description: 'Filter to a particular contract. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: contract
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: Get events after a particular unix timestamp (inclusive)
        name: startTimestamp
        in: query
        schema:
          type: number
      - description: Get events before a particular unix timestamp (inclusive)
        name: endTimestamp
        in: query
        schema:
          type: number
      - description: If true, criteria metadata is included in the response. defaults to **false**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: Order the items are returned in the response. defaults to **desc**
        name: sortDirection
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max limit is 1000. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - x-deprecated
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getBidEventsV3Response'
      deprecated: true
  /execute/call/v1:
    post:
      summary: Make arbitrary same-chain and cross-chain calls via solver
      operationId: postExecuteCallV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model578'
      tags:
      - x-deprecated
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteCallV1Response'
      deprecated: true
  /execute/solve/capacity/v1:
    post:
      summary: Get the capacity for indirect filling via a solver
      operationId: postExecuteSolveCapacityV1
      requestBody:
        $ref: '#/components/requestBodies/Model660'
      tags:
      - x-deprecated
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteSolveCapacityV1Response'
      x-order: 50
      deprecated: true
  /search/collections/v2:
    get:
      summary: Search Collections
      operationId: getSearchCollectionsV2
      parameters:
      - description: 'Lightweight search for collections that match a string. Can also search using contract address. Example: `bored` or `0xbc4ca0eda7647a8ab7c2061c2e118a18a936f13d`'
        x-convert:
          case: lower
        name: name
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: Return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: Filter to a particular collection set
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: If true, will filter any collections marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any collections marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: Use offset to request the next batch of items. defaults to **0**
        name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      - description: Amount of items returned in response. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      tags:
      - x-deprecated
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getSearchCollectionsV2Response'
      deprecated: true
  /transactions/{txHash}/synced/v1:
    get:
      summary: Check Transaction Status
      operationId: getTransactionsTxhashSyncedV1
      description: Get a boolean response on whether a particular transaction was synced or not.
      parameters:
      - x-convert:
          case: lower
        name: txHash
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
      tags:
      - x-deprecated
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTransactionSyncedV1Response'
      x-order: 10
  /transfers/v4:
    get:
      summary: Historical token transfers
      operationId: getTransfersV4
      description: Get recent transfers for a contract or token.
      parameters:
      - description: Filter to a particular contract, e.g. `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`
        x-convert:
          case: lower
        name: contract
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: Filter to a particular token, e.g. `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`
        x-convert:
          case: lower
        name: token
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      - description: Filter to a particular collection, e.g. `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular attribute. Note: Our docs do not support this parameter correctly. To test, you can use the following URL in your browser. Example: `https://api.reservoir.tools/transfers/v2?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attributes[Type]=Original` or `https://api.reservoir.tools/transfers/v2?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attributes[Type]=Original&attributes[Type]=Sibling`'
        name: attributes
        in: query
        x-type: object
        schema:
          type: string
      - description: 'Filter to a particular transaction. Example: `0x04654cc4c81882ed4d20b958e0eeb107915d75730110cce65333221439de6afc`'
        x-convert:
          case: lower
        name: txHash
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
      - description: Order the items are returned in the response. Options are `timestamp`, and `updatedAt`. Default is `timestamp`.
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - timestamp
          - updatedAt
      - x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
      - description: Max limit is 100. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Input any ERC20 address to return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - x-deprecated
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTransfersV4Response'
      deprecated: true
components:
  schemas:
    Model52:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Model578:
      type: object
      properties:
        user:
          type: string
          description: User requesting the calls
          pattern: ^0x[a-fA-F0-9]{40}$
        txs:
          $ref: '#/components/schemas/txs'
        originChainId:
          type: number
          description: Origination chain id (where solver needs to get paid)
        source:
          type: string
          description: 'Filling source used for attribution. Example: `reservoir.market`'
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          x-convert:
            case: lower
      required:
      - user
      - txs
      - originChainId
    Model123:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/Model121'
        collection:
          $ref: '#/components/schemas/Model122'
    Model122:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        isSpam:
          type: boolean
        isNsfw:
          type: boolean
    Model223:
      type: object
      description: Current floor ask price.
      properties:
        currency:
          $ref: '#/components/schemas/currency'
        amount:
          $ref: '#/components/schemas/amount'
        netAmount:
          $ref: '#/components/schemas/netAmount'
    Model28:
      type: object
      description: Total volume change X-days vs previous X-days. (e.g. 7day [days 1-7] vs 7day prior [days 8-14]). A value over 1 is a positive gain, under 1 is a negative loss. e.g. 1 means no change; 1.1 means 10% increase; 0.9 means 10% decrease.
      properties:
        1day:
          type: number
        7day:
          type: number
        30day:
          type: number
    Model167:
      type: object
      properties:
        bid:
          $ref: '#/components/schemas/Model166'
        event:
          $ref: '#/components/schemas/Model158'
    mints:
      type: array
      items:
        $ref: '#/components/schemas/Model149'
    txs:
      type: array
      description: List of transactions to execute
      minItems: 1
      items:
        $ref: '#/components/schemas/Model577'
    price:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/currency'
        amount:
          $ref: '#/components/schemas/amount'
        netAmount:
          $ref: '#/components/schemas/netAmount'
    Model576:
      type: object
      properties:
        gas:
          $ref: '#/components/schemas/price'
        relayer:
          $ref: '#/components/schemas/price'
    Model157:
      type: object
      properties:
        id:
          type: string
          description: Order Id
        status:
          type: string
        contract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        maker:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        price:
          $ref: '#/components/schemas/price'
        quantityRemaining:
          type: number
          description: With ERC1155s, quantity can be higher than 1
        nonce:
          type: string
          pattern: ^-?[0-9]+$
        validFrom:
          type: number
        validUntil:
          type: number
        rawData:
          $ref: '#/components/schemas/metadata'
        kind:
          type: string
        source:
          type: string
        isDynamic:
          type: boolean
        criteria:
          $ref: '#/components/schemas/Model124'
    currency:
      type: object
      properties:
        contract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: number
        chainId:
          type: number
    Model158:
      type: object
      properties:
        id:
          type: number
        kind:
          type: string
          enum:
          - new-order
          - expiry
          - sale
          - cancel
          - balance-change
          - approval-change
          - bootstrap
          - revalidation
          - reprice
        txHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          x-convert:
            case: lower
        txTimestamp:
          type: number
          description: Time when added on the blockchain.
        createdAt:
          type: string
          description: Time when added to indexer
    amount:
      type: object
      description: Amount with fees & royalties included.
      properties:
        raw:
          type: string
          pattern: ^-?[0-9]+$
        decimal:
          type: number
        usd:
          type: number
        native:
          type: number
    Model113:
      type: array
      items:
        $ref: '#/components/schemas/Model112'
    getBidEventsV3Response:
      type: object
      properties:
        events:
          $ref: '#/components/schemas/Model168'
        continuation:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
    Model159:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Model157'
        event:
          $ref: '#/components/schemas/Model158'
    Model147:
      type: object
      properties:

tags:
- name: Tokens
paths:
  /token-sets/v2:
    post:
      summary: Create token set
      operationId: postTokensetsV2
      description: 'Use this API to create a `tokenSetId` to call specific tokens from a collection. Adding or removing a tokenId will change the response. See an example below.


        Input of `0xd774557b647330c91bf44cfeab205095f7e6c367:1` and `0xd774557b647330c91bf44cfeab205095f7e6c367:2`


        Output of `list:0xd774557b647330c91bf44cfeab205095f7e6c367:0xb6fd98eeb7e08fc521f11511289afe4d8e873fd7a3fb76ab757fa47c23f596e9`


        Notes:


        - Include `list:` when using this `tokenSetId` for it to work successfully.


        - You cannot adjust tokens within a `tokenSetId`. Please create a new set.


        - Use the `/tokens/ids` endpoint to get a list of tokens within a set.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model521'
      tags:
      - Tokens
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Model306'
      x-order: 13
  /tokens/bootstrap/v1:
    get:
      summary: Token Events Bootstrap
      operationId: getTokensBootstrapV1
      description: Get the latest price event per token in a collection, so that you can listen to future events and keep track of prices
      parameters:
      - description: 'Filter to a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular contract. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: contract
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. defaults to **500**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
      tags:
      - Tokens
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTokensBootstrapV1Response'
      x-order: 10
  /tokens/flag/changes/v1:
    get:
      summary: Flagged Tokens
      operationId: getTokensFlagChangesV1
      description: This API return the recent flagged/un-flagged tokens across all collections sorted by change time
      parameters:
      - description: '-1 = All tokens (default)

          0 = Non flagged tokens

          1 = Flagged tokens'
        name: flagStatus
        in: query
        schema:
          type: number
          enum:
          - -1
          - 0
          - 1
      - description: Amount of items returned in response. Max is 200. defaults to **200**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
      tags:
      - Tokens
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getFlaggedTokensV1Response'
      x-order: 10
  /tokens/floor/v1:
    get:
      summary: Token Prices
      operationId: getTokensFloorV1
      description: 'This API will return the best price of every token in a collection that is currently on sale. Note: Prices are returned in the native currency of the network.'
      parameters:
      - description: 'Filter to a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular contract. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: contract
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Tokens
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTokensFloorV1Response'
      x-order: 10
  /tokens/ids/v1:
    get:
      summary: Token IDs
      operationId: getTokensIdsV1
      description: This API is optimized for quickly fetching a list of tokens ids in by collection, contract, token set id.
      parameters:
      - description: 'Filter to a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular contract. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: contract
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: 'Filter to a particular token set. Example: `token:CONTRACT:TOKEN_ID` representing a single token within contract, `contract:CONTRACT` representing a whole contract, `range:CONTRACT:START_TOKEN_ID:END_TOKEN_ID` representing a continuous token id range within a contract and `list:CONTRACT:TOKEN_IDS_HASH` representing a list of token ids within a contract.'
        name: tokenSetId
        in: query
        schema:
          type: string
      - description: '-1 = All tokens (default)

          0 = Non flagged tokens

          1 = Flagged tokens'
        name: flagStatus
        in: query
        schema:
          type: number
          enum:
          - -1
          - 0
          - 1
      - description: Amount of items returned in response. Max limit is 10,000. defaults to **100**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^-?[0-9]+$
      tags:
      - Tokens
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTokensIdsV1Response'
      x-order: 9
  /tokens/refresh/v2:
    post:
      summary: Refresh Token
      operationId: postTokensRefreshV2
      description: 'Token metadata is never automatically refreshed, but may be manually refreshed with this API.


        Caution: This API should be used in moderation, like only when missing data is discovered. Calling it in bulk or programmatically will result in your API key getting rate limited.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model650'
      tags:
      - Tokens
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postTokensRefreshV2Response'
      x-order: 13
  /tokens/v7:
    get:
      summary: Tokens
      operationId: getTokensV7
      description: Get a list of tokens with full metadata. This is useful for showing a single token page, or scenarios that require more metadata.
      parameters:
      - description: 'Filter to a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Array of tokens. Max limit is 50. Example: `tokens: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
        x-alternatives:
        - type: array
          description: 'Array of tokens. Max limit is 50. Example: `tokens: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
          maxItems: 50
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
            x-convert:
              case: lower
          collectionFormat: multi
          name: tokens
        - type: string
          description: 'Array of tokens. Max limit is 50. Example: `tokens: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
          x-convert:
            case: lower
        name: tokens
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
            x-convert:
              case: lower
          maxItems: 50
      - description: 'Filter to a particular attribute. Attributes are case sensitive. Note: Our docs do not support this parameter correctly. To test, you can use the following URL in your browser. Example: `https://api.reservoir.tools/tokens/v6?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attributes[Type]=Original` or `https://api.reservoir.tools/tokens/v6?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attributes[Type]=Original&attributes[Type]=Sibling`'
        name: attributes
        in: query
        x-type: object
        schema:
          type: string
      - x-alternatives:
        - type: array
          maxItems: 80
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          collectionFormat: multi
          name: source
        - type: string
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
        name: source
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          maxItems: 80
      - description: Domain of the order source. Example `www.apecoinmarketplace.com`. For a native marketplace, return all tokens listed on this marketplace, even if better prices are available on other marketplaces.
        name: nativeSource
        in: query
        schema:
          type: string
      - x-alternatives:
        - type: array
          maxItems: 80
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          collectionFormat: multi
          name: excludeSources
        - type: string
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
        name: excludeSources
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          maxItems: 80
      - description: Get tokens with a min rarity rank (inclusive), no rarity rank for collections over 100k
        name: minRarityRank
        in: query
        schema:
          type: integer
          minimum: 1
      - description: Get tokens with a max rarity rank (inclusive), no rarity rank for collections over 100k
        name: maxRarityRank
        in: query
        schema:
          type: integer
          minimum: 1
      - description: Get tokens with a min floor ask price (inclusive); use native currency
        name: minFloorAskPrice
        in: query
        schema:
          type: number
      - description: Get tokens with a max floor ask price (inclusive); use native currency
        name: maxFloorAskPrice
        in: query
        schema:
          type: number
      - description: 'Allowed only with collection and tokens filtering!

          -1 = All tokens (default)

          0 = Non flagged tokens

          1 = Flagged tokens'
        name: flagStatus
        in: query
        schema:
          type: number
          enum:
          - -1
          - 0
          - 1
      - description: 'Filter to a particular collection set. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - x-alternatives:
        - type: array
          maxItems: 20
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          collectionFormat: multi
          name: contract
        - type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        name: contract
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          maxItems: 20
      - description: 'Filter to a particular token set. `Example: token:0xa7d8d9ef8d8ce8992df33d8b8cf4aebabd5bd270:129000685`'
        name: tokenSetId
        in: query
        schema:
          type: string
      - description: Order the items are returned in the response. Options are `floorAskPrice`, `tokenId`, `rarity`, `listedAt`, `lastSaleAt`, `lastSalePrice` and `updatedAt`. No rarity rank for collections over 100k. defaults to **floorAskPrice**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - floorAskPrice
          - tokenId
          - rarity
          - updatedAt
          - listedAt
          - lastSaleAt
          - lastSalePrice
      - x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular token by name. This is case sensitive. Example: `token #1`'
        name: tokenName
        in: query
        schema:
          type: string
      - description: 'Filter to tokens with a listing in a particular currency. Max limit is 50. `Example: currencies[0]: 0x0000000000000000000000000000000000000000`'
        x-alternatives:
        - type: array
          description: 'Filter to tokens with a listing in a particular currency. Max limit is 50. `Example: currencies[0]: 0x0000000000000000000000000000000000000000`'
          maxItems: 50
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          collectionFormat: multi
          name: currencies
        - type: string
          description: 'Filter to tokens with a listing in a particular currency. `Example: currencies[0]: 0x0000000000000000000000000000000000000000`'
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        name: currencies
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          maxItems: 50
      - description: Amount of items returned in response. Max limit is 100, except when sorting by `updatedAt` which has a limit of 1000. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      - description: When sorting by `updatedAt`, the start timestamp you want to filter on (UTC).
        name: startTimestamp
        in: query
        schema:
          type: number
      - description: When sorting by `updatedAt`, the end timestamp you want to filter on (UTC).
        name: endTimestamp
        in: query
        schema:
          type: number
      - description: If true, top bid will be returned in the response. defaults to **false**
        name: includeTopBid
        in: query
        schema:
          type: boolean
      - description: If true, mint data for the tokens will be included in the response. defaults to **false**
        name: includeMintStages
        in: query
        schema:
          type: boolean
      - description: Exclude orders that can only be filled by EOAs, to support filling with smart contracts. defaults to false defaults to **false**
        name: excludeEOA
        in: query
        schema:
          type: boolean
      - description: If true, will filter any tokens marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any tokens marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: If true, will filter any burnt tokens. defaults to **false**
        name: excludeBurnt
        in: query
        schema:
          type: boolean
      - description: If true, attributes will be returned in the response. defaults to **false**
        name: includeAttributes
        in: query
        schema:
          type: boolean
      - description: If true, quantity filled and quantity remaining will be returned in the response. defaults to **false**
        name: includeQuantity
        in: query
        schema:
          type: boolean
      - description: If true, dynamic pricing data will be returned in the response. defaults to **false**
        name: includeDynamicPricing
        in: query
        schema:
          type: boolean
      - description: If true, last sale data including royalties paid will be returned in the response. defaults to **false**
        name: includeLastSale
        in: query
        schema:
          type: boolean
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Input any ERC20 address to return result in given currency. Applies to `topBid` and `floorAsk`.
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Tokens
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTokensV7Response'
      x-order: 9
  /tokens/{token}/asks/v1:
    get:
      summary: Token Asks (listings)
      operationId: getTokensTokenAsksV1
      description: Get a list of asks (listings), filtered by token.
      parameters:
      - description: 'The token to get asks for. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`'
        x-convert:
          case: lower
        name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      - description: If true, criteria metadata is included in the response. defaults to **false**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: If true, raw data is included in the response. defaults to **false**
        name: includeRawData
        in: query
        schema:
          type: boolean
      - description: If true, dynamic pricing data will be returned in the response. defaults to **false**
        name: includeDynamicPricing
        in: query
        schema:
          type: boolean
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max limit is 50. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - description: Return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string

tags:
- name: Marketplace
paths:
  /execute/bid/v5:
    post:
      summary: Create Bids
      operationId: postExecuteBidV5
      description: 'Generate bids and submit them to multiple marketplaces.


        Notes:


        - Please use the `/cross-posting-orders/v1` to check the status on cross posted bids.


        - We recommend using Reservoir SDK as it abstracts the process of iterating through steps, and returning callbacks that can be used to update your UI.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model538'
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getExecuteBidV5Response'
      x-order: 11
  /execute/buy/v7:
    post:
      summary: Buy Tokens
      operationId: postExecuteBuyV7
      description: Use this API to fill listings. We recommend using the SDK over this API as the SDK will iterate through the steps and return callbacks. Please mark `excludeEOA` as `true` to exclude Blur orders.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model564'
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getExecuteBuyV7Response'
      x-order: 10
  /execute/cancel/v3:
    post:
      summary: Cancel Orders
      operationId: postExecuteCancelV3
      description: Cancel existing orders on any marketplace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model584'
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getExecuteCancelV3Response'
      x-order: 11
  /execute/list/v5:
    post:
      summary: Create Listings
      operationId: postExecuteListV5
      description: 'Generate listings and submit them to multiple marketplaces.


        Notes:


        - Please use the `/cross-posting-orders/v1` to check the status on cross posted bids.


        - We recommend using Reservoir SDK as it abstracts the process of iterating through steps, and returning callbacks that can be used to update your UI.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model600'
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getExecuteListV5Response'
      x-order: 11
  /execute/mint/v1:
    post:
      summary: Mint Tokens
      operationId: postExecuteMintV1
      description: Use this API to mint tokens. We recommend using the SDK over this API as the SDK will iterate through the steps and return callbacks.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model611'
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteMintV1Response'
      x-order: 10
  /execute/sell/v7:
    post:
      summary: Sell Tokens
      operationId: postExecuteSellV7
      description: Use this API to accept bids. We recommend using the SDK over this API as the SDK will iterate through the steps and return callbacks. Please mark `excludeEOA` as `true` to exclude Blur orders.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model624'
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getExecuteSellV7Response'
      x-order: 10
  /execute/transfer/v1:
    post:
      summary: Transfer Tokens
      operationId: postExecuteTransferV1
      description: Use this endpoint to bulk transfer an array of NFTs.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model635'
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteTransferV1Response'
      x-order: 50
components:
  schemas:
    Model639:
      type: array
      items:
        $ref: '#/components/schemas/Model638'
    Model600:
      type: object
      properties:
        maker:
          type: string
          description: 'Address of wallet making the order. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        source:
          type: string
          description: Domain of your app that is creating the order, e.g. `myapp.xyz`. This is used for filtering, and to attribute the "order source" of sales in on-chain analytics, to help your app get discovered. Lean more <a href='https://docs.reservoir.tools/docs/calldata-attribution'>here</a>
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          x-convert:
            case: lower
        blurAuth:
          type: string
          description: Advanced use case to pass personal blurAuthToken; the API will generate one if left empty.
        params:
          $ref: '#/components/schemas/Model599'
      required:
      - maker
    Model607:
      type: object
      properties:
        signature:
          type: string
          description: 'Signature of the mint function, computed as keccak256. For example: keccak256(''mintWithRewards(address,uint256,uint256,bytes,address)''))'
          pattern: ^0x[a-fA-F0-9]*$
        params:
          $ref: '#/components/schemas/Model606'
      required:
      - signature
    Model568:
      type: array
      items:
        $ref: '#/components/schemas/Model567'
    Model598:
      type: object
      properties:
        token:
          type: string
          description: 'The token the user is listing. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`'
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
          x-convert:
            case: lower
        quantity:
          type: number
          description: 'Quantity of tokens user is listing. Only compatible with ERC1155 tokens. Example: `5`'
        weiPrice:
          type: string
          description: 'Amount seller is willing to sell for in the smallest denomination for the specific currency. Example: `1000000000000000000`'
          pattern: ^-?[0-9]+$
        endWeiPrice:
          type: string
          description: 'Amount seller is willing to sell for Dutch auction in the largest denomination for the specific currency. Example: `2000000000000000000`'
          pattern: ^-?[0-9]+$
        orderKind:
          type: string
          description: 'Exchange protocol used to create order. Example: `seaport-v1.5`'
          default: seaport-v1.5
          enum:
          - blur
          - looks-rare
          - looks-rare-v2
          - zeroex-v4
          - seaport
          - seaport-v1.4
          - seaport-v1.5
          - seaport-v1.6
          - mintify
          - x2y2
          - alienswap
          - payment-processor
          - payment-processor-v2
          - payment-processor-v2.1
        options:
          $ref: '#/components/schemas/Model597'
        orderbook:
          type: string
          description: 'Orderbook where order is placed. Example: `Reservoir`'
          default: reservoir
          enum:
          - blur
          - opensea
          - looks-rare
          - reservoir
          - x2y2
        orderbookApiKey:
          type: string
          description: Optional API key for the target orderbook
        automatedRoyalties:
          type: boolean
          description: If true, royalty amounts and recipients will be set automatically.
          default: true
        royaltyBps:
          type: number
          description: 'Set a maximum amount of royalties to pay, rather than the full amount. Only relevant when using automated royalties. 1 BPS = 0.01% Note: OpenSea does not support values below 50 bps.'
        fees:
          $ref: '#/components/schemas/Model535'
        marketplaceFees:
          $ref: '#/components/schemas/marketplaceFees'
        marketplaceFlatFees:
          $ref: '#/components/schemas/marketplaceFlatFees'
        customRoyalties:
          $ref: '#/components/schemas/customRoyalties'
        listingTime:
          type: string
          description: 'Unix timestamp (seconds) indicating when listing will be listed. Example: `1656080318`'
          pattern: ^[0-9]{10}$
        expirationTime:
          type: string
          description: 'Unix timestamp (seconds) indicating when listing will expire. Example: `1656080318`'
          pattern: ^[0-9]{10}$
        salt:
          type: string
          description: Optional. Random string to make the order unique
          pattern: ^-?[0-9]+$
        nonce:
          type: string
          description: Optional. Set a custom nonce
          pattern: ^-?[0-9]+$
        currency:
          type: string
          default: '0x0000000000000000000000000000000000000000'
          pattern: ^0x[a-fA-F0-9]{40}$
        taker:
          type: string
          description: 'Address of wallet taking the private order. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
      required:
      - token
      - weiPrice
    tx:
      type: object
      properties:
        to:
          type: string
          description: Contract where to send the mint transaction
          pattern: ^0x[a-fA-F0-9]{40}$
        data:
          $ref: '#/components/schemas/Model607'
      required:
      - to
    Model536:
      type: object
      properties:
        token:
          type: string
          description: 'Bid on a particular token. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`'
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
          x-convert:
            case: lower
        tokenSetId:
          type: string
          description: 'Bid on a particular token set. Cannot be used with cross-posting to OpenSea. Example: `token:CONTRACT:TOKEN_ID` representing a single token within contract, `contract:CONTRACT` representing a whole contract, `range:CONTRACT:START_TOKEN_ID:END_TOKEN_ID` representing a continuous token id range within a contract and `list:CONTRACT:TOKEN_IDS_HASH` representing a list of token ids within a contract.'
        collection:
          type: string
          description: 'Bid on a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          x-convert:
            case: lower
        attributeKey:
          type: string
          description: 'Bid on a particular attribute key. This is case sensitive. Example: `Composition`'
        attributeValue:
          type: string
          description: 'Bid on a particular attribute value. This is case sensitive. Example: `Teddy (#33)`'
        quantity:
          type: number
          description: Quantity of tokens to bid on.
        weiPrice:
          type: string
          description: 'Amount bidder is willing to offer in the smallest denomination for the specific currency. Example: `1000000000000000000`'
          pattern: ^-?[0-9]+$
        orderKind:
          type: string
          description: 'Exchange protocol used to create order. Example: `seaport-v1.5`'
          default: seaport-v1.5
          enum:
          - blur
          - zeroex-v4
          - seaport
          - seaport-v1.4
          - seaport-v1.5
          - seaport-v1.6
          - looks-rare
          - looks-rare-v2
          - x2y2
          - alienswap
          - payment-processor
          - payment-processor-v2
          - payment-processor-v2.1
          - mintify
        options:
          $ref: '#/components/schemas/options'
        orderbook:
          type: string
          description: 'Orderbook where order is placed. Example: `Reservoir`'
          default: reservoir
          enum:
          - blur
          - reservoir
          - opensea
          - looks-rare
          - x2y2
        orderbookApiKey:
          type: string
          description: Optional API key for the target orderbook
        automatedRoyalties:
          type: boolean
          description: If true, royalty amounts and recipients will be set automatically.
          default: true
        royaltyBps:
          type: number
          description: 'Set a maximum amount of royalties to pay, rather than the full amount. Only relevant when using automated royalties. 1 BPS = 0.01% Note: OpenSea does not support values below 50 bps.'
        fees:
          $ref: '#/components/schemas/Model535'
        marketplaceFees:
          $ref: '#/components/schemas/marketplaceFees'
        marketplaceFlatFees:
          $ref: '#/components/schemas/marketplaceFlatFees'
        customRoyalties:
          $ref: '#/components/schemas/customRoyalties'
        excludeFlaggedTokens:
          type: boolean
          description: If true flagged tokens will be excluded
          default: false
        listingTime:
          type: string
          description: 'Unix timestamp (seconds) indicating when listing will be listed. Example: `1656080318`'
          pattern: ^[0-9]{10}$
        expirationTime:
          type: string
          description: 'Unix timestamp (seconds) indicating when listing will expire. Example: `1656080318`'
          pattern: ^[0-9]{10}$
        salt:
          type: string
          description: Optional. Random string to make the order unique
          pattern: ^-?[0-9]+$
        nonce:
          type: string
          description: Optional. Set a custom nonce
          pattern: ^-?[0-9]+$
        currency:
          type: string
          default: '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2'
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        usePermit:
          type: boolean
          description: When true, will use permit to avoid approvals.
        checkMakerOutstandingBalance:
          type: boolean
          description: Check if the maker has enough balance to cover all open bid orders (of the current token / collection / attribute type)
      required:
      - weiPrice
    currency:
      type: object
      properties:
        contract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: number
        chainId:
          type: number
    Model638:
      type: object
      properties:
        id:
          type: string
          description: Returns `nft-approval` or `transfer`
        kind:
          type: string
          description: Returns `transaction`
          enum:
          - transaction
        action:
          type: string
        description:
          type: string
        items:
          $ref: '#/components/schemas/Model637'
      required:
      - id
      - kind
      - action
      - description
      - items
    Model575:
      type: object
      properties:
        itemIndex:
          type: number
        maxQuantity:
          type: string
          pattern: ^-?[0-9]+$
      required:
      - itemIndex
    Model541:
      type: object
      properties:
        id:
          type: string
          description: Returns `currency-wrapping`, `currency-approval`, or `order-signature`.
        kind:
          type: string
          description: Returns `request`, `signature`, or `transaction`.
          enum:
          - request
          - signature
          - transaction
        action:
          type: string
        description:
          type: string
        items:
          $ref: '#/components/schemas/Model540'
      required:
      - id
      - kind
      - action
      - description
      - items
    seaport-v1.4:
      type: object
      properties:
        conduitKey:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
        useOffChainCancellation:
          type: boolean
        replaceOrderId:
          type: string
      required:
      - useOffChainCancellation
    Model608:
      type: object
      properties:
        collection:
          type: string
          description: Collection to mint.
          x-convert:
            case: lower
        token:
          type: string
          description: Token to mint.
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
          x-convert:
            case: lower
        custom:
          $ref: '#/components/schemas/custom'
        quantity:
          type: integer
          description: Quantity of tokens to mint.
          x-constraint:
            sign: positive
        preferredMintStage:
          type: string
          description: Optionally specify a stage to mint
    getExecuteSellV7Response:
      type: object
      properties:
        requestId:
          type: string
        steps:
          $ref: '#/components/schemas/Model628'
        errors:
          $ref: '#/components/schemas/Model570'
        path:
          $ref: '#/components/schemas/Model630'
    getExecuteCancelV3Response:
      type: object
      properties:
        steps:
          $ref: '#/components/schemas/Model588'
    Model570:
      type: array
      items:
        $ref: '#/components/schemas/Model569'
    Model560:
      type: array
      maxItems: 2
      items:
        type: string
        pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
        x-convert:
          case: lower
    check:
      type: object
      description: The details of the endpoint for checking the status of the step
      properties:
        endpoint:
          type: string
        method:
          type: string
          enum:
          - POST
        body:
          type: string
      required:
      - endpoint
      - method
    Model630:
      type: array
      items:
        $ref: '#/components/schemas/Model629'
    metadata:
      type: object
    Model601:
      type: object
      properties:
        status:
          type: string
          description: Returns `complete` or `incomplete`.
          enum:
          - complete
          - incomplete
        tip:
          type: string
        data:
          $ref: '#/components/schemas/metadata'
        orderIndexes:
          $ref: '#/components/schemas/floorAskPrices'
      required:
      - status
    Model610:
      type: array
      description: 'List of fees (formatted as `feeRecipient:feeAmount`) to be taken when minting.

        Unless overridden via the `currency` param, the currency used for any fees on top matches the buy-in currency detected by the backend.

        Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00:1000000000000000`'
      items:
        type: string
        pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
    Model564:
      type: object
      properties:
        items:
          $ref: '#/components/schemas/Model563'
        taker:
          type: string
          description: Address of wallet filling (receiver of the NFT).
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        relayer:
          type: string
          description: Address of wallet relaying the fill transaction (paying for the NFT).
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        onlyPath:
          type: boolean
          description: If true, only the path will be returned.
          default: false
        forceRouter:
          type: boolean
          description: If true, all fills will be executed through the router (where possible)
        forwarderChannel:
          type: string
          description: If passed, all fills will be executed through the trusted trusted forwarder (where possible)
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        currency:
          type: string
          description: Currency to be used for purchases.
          x-convert:
            case: lower
        currencyChainId:
          type: number
          description: The chain id of the purchase currency
        normalizeRoyalties:
          type: boolean
          description: Charge any missing royalties.
          default: false
        allowInactiveOrderIds:
          type: boolean
          description: If true, inactive orders will not be skipped over (only relevant when filling via a specific order id).
          default: false
        source:
          type: string
          description: 'Filling source used for attribution. Example: `reservoir.market`'
          pattern: ^[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,}$|localhost
          x-convert:
            case: lower
        feesOnTop:
          $ref: '#/components/schemas/Model554'
        partial:
          type: boolean
          description: If true, any off-chain or on-chain errors will be skipped.
          default: false
        skipBalanceCheck:
          type: boolean
          description: If true, balance check will be skipped.
          default: false
        excludeEOA:
          type: boolean

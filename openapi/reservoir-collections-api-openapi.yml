tags:
- name: Collections
paths:
  /collections-sets/v1:
    post:
      summary: Create collection set
      operationId: postCollectionssetsV1
      description: 'Array of collections to gather in a set. Adding or removing a collection will change the response. You may use this set when `collectionSetId` is an available param. The max limit of collection in an array is 500. An example is below.


        `"collections": "0xba30E5F9Bb24caa003E9f2f0497Ad287FDF95623", "0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D"`


        `"collectionsSetId": "8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65"`'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model502'
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postCreateCollectionsSetV1Response'
      x-order: 13
  /collections/refresh/v2:
    post:
      summary: Refresh Collection
      operationId: postCollectionsRefreshV2
      description: 'Use this API to refresh a collection metadata. Only use this endpoint when you notice multiple tokens with incorrect metadata. Otherwise, refresh single token metadata. Collections with over 30,000 tokens require admin key override, so please contact technical support for assistance.


        Collection metadata is automatically updated at 23:30 UTC daily for:


        - Top 500 Collection by 24hr Volume


        - Collections Minted 1 Day Ago


        - Collections Minted 7 Days Ago


        Caution: This API should be used in moderation, like only when missing data is discovered. Calling it in bulk or programmatically will result in your API key getting rate limited.'
      parameters:
      - name: x-api-key
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model528'
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/putSetCollectionCommunityV1Response'
      x-order: 13
  /collections/search/v1:
    get:
      summary: Search Collections (Cross Chain)
      operationId: getCollectionsSearchV1
      parameters:
      - description: 'Array of chains. Max limit is 50. Example: `chains[0]: 1`'
        x-alternatives:
        - type: array
          description: 'Array of chains. Max limit is 50. Example: `chains[0]: 1`'
          maxItems: 50
          items:
            type: number
          collectionFormat: multi
          name: chains
        - type: number
          description: 'Array of chains. Max limit is 50. Example: `chains[0]: 1`'
        name: chains
        in: query
        explode: true
        schema:
          type: array
          items:
            type: number
          maxItems: 50
      - description: 'Lightweight search for collections that match a string. Example: `bored`'
        x-convert:
          case: lower
        name: prefix
        in: query
        required: true
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: If true, will filter any collections marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any collections marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: Amount of items returned in response. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getCollectionSearchV1Response'
      x-order: 3
  /collections/trending-mints/v2:
    get:
      summary: Top Trending Mints
      operationId: getCollectionsTrendingmintsV2
      description: Get top trending mints
      parameters:
      - description: Time window to aggregate. defaults to **24h**
        name: period
        in: query
        schema:
          type: string
          enum:
          - 5m
          - 10m
          - 30m
          - 1h
          - 2h
          - 6h
          - 24h
      - description: The type of the mint (free/paid). defaults to **any**
        name: type
        in: query
        schema:
          type: string
          enum:
          - free
          - paid
          - any
      - description: Amount of items returned in response. Default is 50 and max is 50. Expected to be sorted and filtered on client side. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - x-alternatives:
        - type: array
          maxItems: 20
          items:
            type: string
          collectionFormat: multi
          name: mintStandard
        - type: string
        name: mintStandard
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 20
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: If true, return the non flagged floor ask. Supported only when `normalizeRoyalties` is false. defaults to **false**
        name: useNonFlaggedFloorAsk
        in: query
        schema:
          type: boolean
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/get-trending-mintsV2Response'
      x-order: 3
  /collections/trending/v1:
    get:
      summary: Top Trending Collections
      operationId: getCollectionsTrendingV1
      description: Get trending selling/minting collections
      parameters:
      - description: Time window to aggregate. defaults to **1d**
        name: period
        in: query
        schema:
          type: string
          enum:
          - 5m
          - 10m
          - 30m
          - 1h
          - 6h
          - 1d
          - 24h
          - 7d
          - 30d
      - description: Amount of items returned in response. Default is 50 and max is 1000. Expected to be sorted and filtered on client side. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - volume
          - sales
        description: defaults to **sales**
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: If true, return the non flagged floor ask. Supported only when `normalizeRoyalties` is false. defaults to **false**
        name: useNonFlaggedFloorAsk
        in: query
        schema:
          type: boolean
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTrendingCollectionsV1Response'
      x-order: 3
  /collections/v7:
    get:
      summary: Collections
      operationId: getCollectionsV7
      description: Use this API to explore a collection's metadata and statistics (sales, volume, etc).
      parameters:
      - description: "Filter to a particular collection with collection id. The id is immutable.\n For single contract collections, the id is the contract address e.g. `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`\n Artblocks will follow this format with a token range: `{artblocksContractAddress}:{startTokenId}:{endTokenId}`\n Shared contracts will generally follow the format `{contract}:{namespace}-{id}`; The following shared contracts will follow this format:\n OpenSea, Sound, SuperRare, Foundation, Ordinals, & Courtyard"
        x-convert:
          case: lower
        name: id
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection slug. We recommend to rely on collection id; slugs are dynamic and can change without warning. Example: `boredapeyachtclub`'
        name: slug
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection set. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - x-alternatives:
        - type: array
          maxItems: 20
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          collectionFormat: multi
          name: contract
        - type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        name: contract
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          maxItems: 20
      - description: Filter by creator
        x-convert:
          case: lower
        name: creator
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: 'Search for collections that match a string. Example: `bored`'
        x-convert:
          case: lower
        name: name
        in: query
        schema:
          type: string
      - description: Maximum floor price of the collection
        name: maxFloorAskPrice
        in: query
        schema:
          type: number
      - description: Minumum floor price of the collection
        name: minFloorAskPrice
        in: query
        schema:
          type: number
      - description: If true, attributes will be included in the response. Must filter by `id` or `slug` to a particular collection.
        name: includeAttributes
        in: query
        schema:
          type: boolean
      - description: If true, sales count (1 day, 7 day, 30 day, all time) will be included in the response. Must filter by `id` or `slug` to a particular collection.
        name: includeSalesCount
        in: query
        schema:
          type: boolean
      - description: If true, mint data for the collection will be included in the response. defaults to **false**
        name: includeMintStages
        in: query
        schema:
          type: boolean
      - description: If true, security configuration data (e.g. ERC721C or Operator Filter Registry configuration) will be included in the response. defaults to **false**
        name: includeSecurityConfigs
        in: query
        schema:
          type: boolean
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: If true, return the non flagged floor ask. Supported only when `normalizeRoyalties` is false. defaults to **false**
        name: useNonFlaggedFloorAsk
        in: query
        schema:
          type: boolean
      - description: Order the items are returned in the response. Options are `#DayVolume`, `createdAt`, `updatedAt`, `lastMintTimestamp`, or `floorAskPrice` defaults to **allTimeVolume**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - 1DayVolume
          - 7DayVolume
          - 30DayVolume
          - allTimeVolume
          - createdAt
          - updatedAt
          - floorAskPrice
          - lastMintTimestamp
      - x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
      - description: Amount of items returned in response. Default and max limit is 20, unless sorting by `updatedAt` which has a max limit of 1000. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      - description: If true, will filter any collections marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any collections marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: When sorting by `updatedAt`, the start timestamp you want to filter on (UTC).
        name: startTimestamp
        in: query
        schema:
          type: number
      - description: When sorting by `updatedAt`, the end timestamp you want to filter on (UTC).
        name: endTimestamp
        in: query
        schema:
          type: number
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
      - description: Input any ERC20 address to return result in given currency. Applies to `topBid` and `floorAsk`.
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getCollectionsV7Response'
      x-order: 3
  /collections/{collectionId}/bids/v1:
    get:
      summary: Collection Bids (offers)
      operationId: getCollectionsCollectionidBidsV1
      description: Get a list of bids (offers), filtered by collection.
      parameters:
      - description: 'Filter to a particular collection. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collectionId
        in: path
        required: true
        schema:
          type: string
      - description: Filter to a particular order type. Must be one of `token`, `collection`, `attribute`, `custom`.
        name: type
        in: query
        schema:
          type: string
          enum:
          - token
          - collection
          - attribute
          - custom
      - description: If true, criteria metadata is included in the response. defaults to **false**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: If true, raw data is included in the response. defaults to **false**
        name: includeRawData
        in: query
        schema:
          type: boolean
      - description: If true, the depth of each order is included in the response. defaults to **false**
        name: includeDepth
        in: query
        schema:
          type: boolean
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max limit is 50. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - description: Return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getOrdersBidsV5Response'
      x-order: 5
  /collections/{collection}/marketplace-configurations/v2:
    get:
      summary: Marketplace configurations by collection
      operationId: getCollectionsCollectionMarketplaceconfigurationsV2
      description: This API returns recommended marketplace configurations given a collection id
      parameters:
      - description: Filter to a particular collection, e.g. `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`
        x-convert:
          case: lower
        name: collection
        in: path
        required: true
        schema:
          type: string
      - description: When set, token-level royalties will be returned in the response
        name: tokenId
        in: query
        required: false
        schema:
          type: string
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Model284'
      x-order: 5
  /collections/{collection}/top-traders/v1:
    get:
      summary: Top Traders
      operationId: getCollectionsCollectionToptradersV1
      description: Get top traders for a particular collection
      parameters:
      - description: Filter to a particular collection, e.g. `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`
        x-convert:
          case: lower
        name: collection
        in: path
        required: true
        schema:
          type: string
      - description: Time window to aggregate. defaults to **1d**
        name: period
        in: query
        schema:
          type: string
          enum:
          - 6h
          - 1d
          - 7d
      - description: Amount of items returned in response. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTopTradersV1Response'
      x-order: 6
  /contracts-sets/v1:
    post:
      summary: Create contracts set
      operationId: postContractssetsV1
      description: 'Array of contracts to gather in a set. Adding or removing a contract will change the response. You may use this set when contractSetId is an available param. Max limit of contracts passed in an array is 500. An example is below.


        `"contracts": "0x60e4d786628fea6478f785a6d7e704777c86a7c6", "0xbc4ca0eda7647a8ab7c2061c2e118a18a936f13d"`


        `"contractsSetId": "74cc9bdc0824e92de13c75213015916557fcf8187e43b34a8e77175cd03d1931"'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model503'
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postCreateContractsSetV1Response'
      x-order: 1
components:
  schemas:
    operatorWhitelist:
      type: array
      items:
        type: string
        pattern: ^0x[a-fA-F0-9]{40}$
        x-convert:
          case: lower
    Model36:
      type: array
      items:
        $ref: '#/components/schemas/Model35'
    Model122:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        isSpam:
          type: boolean
        isNsfw:
          type: boolean
    Model29:
      type: object
      description: Floor sale change from X-days vs X-days ago. (e.g. 7day floor sale vs floor sale 14 days ago). A value over 1 is a positive gain, under 1 is a negative loss. e.g. 1 means no change; 1.1 means 10% increase; 0.9 means 10% decrease.
      properties:
        1day:
          type: number
        7day:
          type: number
        30day:
          type: number
    Model193:
      type: object
      properties:
        kind:
          type: string
          enum:
          - dutch
        data:
          $ref: '#/components/schemas/Model192'
    Model299:
      type: object
      properties:
        address:
          type: string
        volume:
          type: number
        count:
          type: number
    contracts:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: string
        description: 'Array of contracts to gather in a set. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        pattern: ^0x[a-fA-F0-9]{40}$
        x-convert:
          case: lower
    Model502:
      type: object
      properties:
        collections:
          $ref: '#/components/schemas/Model501'
      required:
      - collections
    get-trending-mintsV2Response:
      type: object
      properties:
        mints:
          $ref: '#/components/schemas/Model153'
    Model279:
      type: object
      properties:
        minBps:
          type: number
        maxBps:
          type: number
    currency:
      type: object
      properties:
        contract:
          type: string

security:
- API_KEY: []
tags:
- name: Misc
paths:
  /execute/auth-signature/v1:
    post:
      summary: Attach a signature to an existing auth challenge
      operationId: postExecuteAuthsignatureV1
      parameters:
      - description: Signature to attach to the auth challenge
        name: signature
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model530'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postAuthSignatureV1Response'
      x-order: 50
  /execute/cancel-signature/v1:
    post:
      summary: Off-chain cancel orders
      operationId: postExecuteCancelsignatureV1
      description: If your order was created using the Seaport Oracle to allow off chain & gasless cancellations, you can just use the Kit's cancel modals, SDK's `cancelOrder`, or `/execute/cancel/`. Those tools will automatically access this endpoint for an oracle cancellation without you directly calling this endpoint.
      parameters:
      - description: Cancellation signature
        name: signature
        in: query
        schema:
          type: string
      - description: Optional auth token used instead of the signature
        name: auth
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model590'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/putSetCollectionCommunityV1Response'
      x-order: 50
  /execute/deposit/v1:
    post:
      summary: Deposit funds to the solver
      operationId: postExecuteDepositV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model591'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteDepositV1Response'
      x-order: 50
  /execute/permit-signature/v1:
    post:
      summary: Attach a signature to an existing permit
      operationId: postExecutePermitsignatureV1
      parameters:
      - description: Signature to attach to the permit
        name: signature
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model614'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/putSetCollectionCommunityV1Response'
      x-order: 50
  /execute/pre-signature/v1:
    post:
      summary: Attach a signature to an existing pre-signature
      operationId: postExecutePresignatureV1
      parameters:
      - description: Signature to attach to the pre-signature
        name: signature
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model615'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/putSetCollectionCommunityV1Response'
      x-order: 50
  /execute/results/v1:
    post:
      summary: Send the success status of an execution
      operationId: postExecuteResultsV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model616'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteResultsV1Response'
      x-order: 50
  /execute/solve/capacity/v2:
    post:
      summary: Get the capacity for indirect filling via a solver
      operationId: postExecuteSolveCapacityV2
      requestBody:
        $ref: '#/components/requestBodies/Model660'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteSolveCapacityV2Response'
      x-order: 50
  /execute/solve/v1:
    post:
      summary: Indirectly fill an order via a solver
      operationId: postExecuteSolveV1
      parameters:
      - description: Signature for the solve request
        name: signature
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model631'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteSolveV1Response'
      x-order: 50
  /execute/status/v1:
    post:
      summary: Get the status of an execution
      operationId: postExecuteStatusV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model632'
      tags:
      - Misc
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/postExecuteStatusV1Response'
      x-order: 50
components:
  schemas:
    postExecuteResultsV1Response:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    postExecuteSolveV1Response:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/status'
    status:
      type: object
      properties:
        endpoint:
          type: string
        method:
          type: string
          enum:
          - POST
        body:
          type: string
      required:
      - endpoint
      - method
    price:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/currency'
        amount:
          $ref: '#/components/schemas/amount'
        netAmount:
          $ref: '#/components/schemas/netAmount'
    Model589:
      type: array
      description: Ids of the orders to cancel
      minItems: 1
      items:
        type: string
    Model576:
      type: object
      properties:
        gas:
          $ref: '#/components/schemas/price'
        relayer:
          $ref: '#/components/schemas/price'
    currency:
      type: object
      properties:
        contract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: number
        chainId:
          type: number
    postExecuteSolveCapacityV2Response:
      type: object
      properties:
        capacityPerRequest:
          type: string
          pattern: ^-?[0-9]+$
        totalCapacity:
          type: string
          pattern: ^-?[0-9]+$
        userBalance:
          $ref: '#/components/schemas/userBalance'
        maxPricePerItem:
          type: string
          pattern: ^-?[0-9]+$
      required:
      - capacityPerRequest
      - totalCapacity
      - maxPricePerItem
    amount:
      type: object
      description: Amount with fees & royalties included.
      properties:
        raw:
          type: string
          pattern: ^-?[0-9]+$
        decimal:
          type: number
        usd:
          type: number
        native:
          type: number
    Model592:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        description:
          type: string
        kind:
          type: string
          enum:
          - transaction
        items:
          $ref: '#/components/schemas/Model580'
      required:
      - id
      - action
      - description
      - kind
      - items
    Model632:
      type: object
      properties:
        kind:
          type: string
          description: Execution kind
          enum:
          - cross-chain-intent
          - cross-chain-transaction
          - transaction
        id:
          type: string
          description: The id of the execution (eg. transaction / order / intent hash)
        chainId:
          type: number
          description: Chain id where the action is happening (only relevant for 'cross-chain-transaction' actions)
      required:
      - kind
      - id
    netAmount:
      type: object
      description: Amount with fees & royalties removed.
      properties:
        raw:
          type: string
          pattern: ^-?[0-9]+$
        decimal:
          type: number
        usd:
          type: number
        native:
          type: number
    Model615:
      type: object
      properties:
        id:
          type: string
          description: Id of the pre-signature
      required:
      - id
    Model616:
      type: object
      properties:
        requestId:
          type: string
          description: Request id of the associate execute API request
        stepId:
          type: string
          description: Step id of the relevant execute item
        txHash:
          type: string
          description: Associated transaction hash
          pattern: ^0x[a-fA-F0-9]{64}$
        errorMessage:
          type: string
          description: Associated error message
      required:
      - requestId
      - stepId
    postExecuteStatusV1Response:
      type: object
      properties:
        status:
          type: string
        details:
          type: string
        txHashes:
          $ref: '#/components/schemas/txHashes'
        time:
          type: number
      required:
      - status
    Model579:
      type: object
      properties:
        status:
          type: string
          enum:
          - complete
          - incomplete
        data:
          $ref: '#/components/schemas/metadata'
        check:
          $ref: '#/components/schemas/check'
      required:
      - status
    Model614:
      type: object
      properties:
        id:
          type: string
          description: Id of the permit
        persist:
          type: boolean
          description: Whether to persist the permit or not
      required:
      - id
    putSetCollectionCommunityV1Response:
      type: object
      properties:
        message:
          type: string
    Model590:
      type: object
      properties:
        orderIds:
          $ref: '#/components/schemas/Model589'
        orderKind:
          type: string
          description: 'Exchange protocol used to bulk cancel order. Example: `seaport-v1.5`'
          enum:
          - seaport-v1.4
          - seaport-v1.5
          - seaport-v1.6
          - alienswap
          - mintify
          - blur-bid
          - payment-processor-v2
          - payment-processor-v2.1
      required:
      - orderIds
      - orderKind
    Model631:
      type: object
      properties:
        kind:
          type: string
          enum:
          - cross-chain-intent
        request:
          type: string
        tx:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
      required:
      - kind
    Model580:
      type: array
      items:
        $ref: '#/components/schemas/Model579'
    Model593:
      type: array
      items:
        $ref: '#/components/schemas/Model592'
    check:
      type: object
      description: The details of the endpoint for checking the status of the step
      properties:
        endpoint:
          type: string
        method:
          type: string
          enum:
          - POST
        body:
          type: string
      required:
      - endpoint
      - method
    Model530:
      type: object
      properties:
        kind:
          type: string
          description: Type of auth
          enum:
          - blur
          - erc721c
          - opensea
        id:
          type: string
          description: Id of the auth challenge
      required:
      - kind
      - id
    txHashes:
      type: array
      items:
        type: string
        pattern: ^0x[a-fA-F0-9]{64}$
    postExecuteDepositV1Response:
      type: object
      properties:
        steps:
          $ref: '#/components/schemas/Model593'
        fees:
          $ref: '#/components/schemas/Model576'
    userBalance:
      type: object
      properties:
        currentChain:
          type: string
          pattern: ^-?[0-9]+$
        allChains:
          type: string
          pattern: ^-?[0-9]+$
      required:
      - currentChain
      - allChains
    Model660:
      type: object
      properties:
        kind:
          type: string
          enum:
          - cross-chain-intent
        user:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      required:
      - kind
    Model591:
      type: object
      properties:
        user:
          type: string
          description: User depositing
          pattern: ^0x[a-fA-F0-9]{40}$
        amount:
          type: string
          description: Amount to deposit
          pattern: ^-?[0-9]+$
      required:
      - user
      - amount
    metadata:
      type: object
    postAuthSignatureV1Response:
      type: object
      properties:
        auth:
          type: string
  requestBodies:
    Model660:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Model660'
  securitySchemes:
    API_KEY:
      type: apiKey
      name: x-api-key
      in: header
      x-default: demo-api-key

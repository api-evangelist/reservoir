tags:
- name: Accounts
paths:
  /orders/users/{user}/top-bids/v4:
    get:
      summary: User Top Bids
      operationId: getOrdersUsersUserTopbidsV4
      description: Return the top bids for the given user tokens. Please mark `excludeEOA` as `true` to exclude Blur orders.
      parameters:
      - description: 'Filter to a particular user. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
        x-convert:
          case: lower
        name: user
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - x-convert:
          case: lower
        x-alternatives:
        - type: string
          x-convert:
            case: lower
        - type: array
          items:
            type: string
            x-convert:
              case: lower
          collectionFormat: multi
          name: collection
        name: collection
        in: query
        schema:
          type: string
      - description: Filter to a particular contracts set.
        x-convert:
          case: lower
        name: contractsSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection set. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: If true, urls will only be returned for optimized sources that support royalties. defaults to **false**
        name: optimizeCheckoutURL
        in: query
        schema:
          type: boolean
      - description: If true, criteria metadata is included in the response. defaults to **true**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: Exclude orders that can only be filled by EOAs, to support filling with smart contracts. defaults to **false**
        name: excludeEOA
        in: query
        schema:
          type: boolean
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: If true, will return the collection non flagged floor ask events. defaults to **false**
        name: useNonFlaggedFloorAsk
        in: query
        schema:
          type: boolean
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
      - description: Order of the items are returned in the response. Options are `topBidValue`, `dateCreated`, `orderExpiry`, and `floorDifferencePercentage`. defaults to **topBidValue**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - topBidValue
          - dateCreated
          - orderExpiry
          - floorDifferencePercentage
      - x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        description: defaults to **desc**
      - description: Amount of items returned in response. Max limit is 100 defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - description: Amount of tokens considered. Min is 1000, max is default. defaults to **10000**
        name: sampleSize
        in: query
        schema:
          type: integer
          minimum: 1000
          maximum: 100000
      - description: Input any ERC20 address to return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getUserTopBidsV4Response'
      x-order: 7
  /users/{user}/asks/v1:
    get:
      summary: User Asks (listings)
      operationId: getUsersUserAsksV1
      description: Get a list of asks (listings), filtered by maker.
      parameters:
      - description: 'Filter to a particular user. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
        x-convert:
          case: lower
        name: user
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - x-alternatives:
        - type: array
          items:
            type: string
          collectionFormat: multi
          name: ids
        - type: string
        name: ids
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: 'activeª^º = currently valid

          inactiveª^ = temporarily invalid

          expiredª^, cancelledª^, filledª^ = permanently invalid'
        name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - expired
          - cancelled
          - filled
      - description: 'Filter to a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection set. Requires `maker` to be passed. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: Order the items are returned in the response. Sorting by `price` is ascending order / Sorting by `createdAt` is descending order.  defaults to **createdAt**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - price
      - description: If true, criteria metadata is included in the response. defaults to **false**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: If true, raw data is included in the response. defaults to **false**
        name: includeRawData
        in: query
        schema:
          type: boolean
      - description: If true, dynamic pricing data will be returned in the response. defaults to **false**
        name: includeDynamicPricing
        in: query
        schema:
          type: boolean
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max limit is 50. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - description: Return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getOrdersBidsV5Response'
      x-order: 5
  /users/{user}/bids/v1:
    get:
      summary: User Bids (offers)
      operationId: getUsersUserBidsV1
      description: Get a list of bids (offers), filtered by maker.
      parameters:
      - description: 'Filter to a particular user. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
        x-convert:
          case: lower
        name: user
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - x-alternatives:
        - type: array
          items:
            type: string
          collectionFormat: multi
          name: ids
        - type: string
        name: ids
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Filter to a particular order type. Must be one of `token`, `collection`, `attribute`, `custom`.
        name: type
        in: query
        schema:
          type: string
          enum:
          - token
          - collection
          - attribute
          - custom
      - description: 'activeª^º = currently valid

          inactiveª^ = temporarily invalid

          valid^ = both active and inactive orders'
        name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - valid
      - description: 'Filter to a particular collection bids with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection set. Requires `maker` to be passed. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: Order the items are returned in the response. Defaults sorting direction to descending.  defaults to **createdAt**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - price
      - description: If true, criteria metadata is included in the response. defaults to **false**
        name: includeCriteriaMetadata
        in: query
        schema:
          type: boolean
      - description: If true, raw data is included in the response. defaults to **false**
        name: includeRawData
        in: query
        schema:
          type: boolean
      - description: If true, the depth of each order is included in the response. defaults to **false**
        name: includeDepth
        in: query
        schema:
          type: boolean
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max limit is 50. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - description: Return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getOrdersBidsV5Response'
      x-order: 5
  /users/{user}/collections/v4:
    get:
      summary: User collections
      operationId: getUsersUserCollectionsV4
      description: Get aggregate stats for a user, grouped by collection. Useful for showing total portfolio information.
      parameters:
      - description: 'Filter to a particular user. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
        x-convert:
          case: lower
        name: user
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection set. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: 'Array of collections. Max limit is 100. Example: `collections[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-alternatives:
        - type: array
          description: 'Array of collections. Max limit is 100. Example: `collections[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          minItems: 1
          maxItems: 100
          items:
            type: string
            x-convert:
              case: lower
          collectionFormat: multi
          name: collection
        - type: string
          description: 'Array of collections. Max limit is 100. Example: `collections[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          x-convert:
            case: lower
        name: collection
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            x-convert:
              case: lower
          minItems: 1
          maxItems: 100
      - x-alternatives:
        - type: array
          maxItems: 100
          items:
            type: string
          collectionFormat: multi
          name: excludeCollections
        - type: string
        name: excludeCollections
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 100
      - description: 'Filter to a particular collection with name. This is case insensitive. Example: `ape`'
        x-convert:
          case: lower
        name: name
        in: query
        schema:
          type: string
      - description: If true, top bid will be returned in the response. defaults to **false**
        name: includeTopBid
        in: query
        schema:
          type: boolean
      - description: If true, number of tokens with bids will be returned in the response. defaults to **false**
        name: includeLiquidCount
        in: query
        schema:
          type: boolean
      - description: If true, number of listed tokens will be returned in the response. defaults to **false**
        name: includeOnSaleCount
        in: query
        schema:
          type: boolean
      - description: If true, will filter any collections marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any collections marked as spam. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: Use offset to request the next batch of items. Max is 10,000. defaults to **0**
        name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
      - description: Amount of items returned in response. max limit is 100. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - description: Input any ERC20 address to return result in given currency. Applies to `topBid` and `floorAsk`.
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: Order the items are returned in the response. Options are `allTimeVolume`, `totalValue`, `floorAskPrice` defaults to **allTimeVolume**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - allTimeVolume
          - totalValue
          - floorAskPrice
      - description: Order the items are returned in the response. defaults to **desc**
        x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getUserCollectionsV4Response'
      x-order: 3
  /users/{user}/tokens/v10:
    get:
      summary: User Tokens
      operationId: getUsersUserTokensV10
      description: Get tokens held by a user, along with ownership information such as associated orders and date acquired.
      parameters:
      - description: 'Filter to a particular user. Example: `0xF296178d553C8Ec21A2fBD2c5dDa8CA9ac905A00`'
        x-convert:
          case: lower
        name: user
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: Filter to a particular community, e.g. `artblocks`
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular collection set. Example: `8daa732ebe5db23f267e58d52f1c9b1879279bcdf4f78b8fb563390e6946ea65`'
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: 'Array of collections. Max limit is 100. Example: `collections[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-alternatives:
        - type: array
          description: 'Array of collections. Max limit is 100. Example: `collections[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          minItems: 1
          maxItems: 100
          items:
            type: string
            x-convert:
              case: lower
          collectionFormat: multi
          name: collection
        - type: string
          description: 'Array of collections. Max limit is 100. Example: `collections[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          x-convert:
            case: lower
        name: collection
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            x-convert:
              case: lower
          minItems: 1
          maxItems: 100
      - x-alternatives:
        - type: array
          maxItems: 100
          items:
            type: string
          collectionFormat: multi
          name: excludeCollections
        - type: string
        name: excludeCollections
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 100
      - description: Filter to a particular contract, e.g. `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`
        x-convert:
          case: lower
        name: contract
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: 'Array of tokens. Max limit is 50. Example: `tokens[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens[1]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
        x-alternatives:
        - type: array
          description: 'Array of tokens. Max limit is 50. Example: `tokens[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens[1]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
          maxItems: 50
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
            x-convert:
              case: lower
          collectionFormat: multi
          name: tokens
        - type: string
          description: 'Array of tokens. Max limit is 50. Example: `tokens[0]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:704 tokens[1]: 0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:979`'
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
          x-convert:
            case: lower
        name: tokens
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
            x-convert:
              case: lower
          maxItems: 50
      - description: If true, prices will include missing royalties to be added on-top. defaults to **false**
        name: normalizeRoyalties
        in: query
        schema:
          type: boolean
      - description: Order the items are returned in the response. Options are `acquiredAt`, `lastAppraisalValue` and `floorAskPrice`. `lastAppraisalValue` is the value of the last sale. `floorAskPrice` is the collection floor ask defaults to **acquiredAt**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - acquiredAt
          - lastAppraisalValue
          - floorAskPrice
      - description: Order the items are returned in the response. defaults to **desc**
        x-convert:
          case: lower
        name: sortDirection
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      - description: Amount of items returned in response. Max limit is 200. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - description: If true, top bid will be returned in the response. defaults to **false**
        name: includeTopBid
        in: query
        schema:
          type: boolean
      - description: If true, attributes will be returned in the response. defaults to **false**
        name: includeAttributes
        in: query
        schema:
          type: boolean
      - description: If true, last sale data including royalties paid will be returned in the response. defaults to **false**
        name: includeLastSale
        in: query
        schema:
          type: boolean
      - description: If true, raw data is included in the response. defaults to **false**
        name: includeRawData
        in: query
        schema:
          type: boolean
      - description: If true, dynamic pricing data will be returned in the response. defaults to **false**
        name: includeDynamicPricing
        in: query
        schema:
          type: boolean
      - description: If true, will filter any tokens marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any tokens marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: If true, will filter any tokens that are not listed defaults to **false**
        name: onlyListed
        in: query
        schema:
          type: boolean
      - description: If true, will return the collection non flagged floor ask. defaults to **false**
        name: useNonFlaggedFloorAsk
        in: query
        schema:
          type: boolean
      - description: Input any ERC20 address to return result in given currency. Applies to `topBid` and `floorAsk`.
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - description: 'Filter to a particular token by name. This is case sensitive. Example: `token #1`'
        name: tokenName
        in: query
        schema:
          type: string
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getUserTokensV10Response'
      x-order: 9

tags:
- name: Activity
paths:
  /collections/activity/v6:
    get:
      summary: Collection activity
      operationId: getCollectionsActivityV6
      description: This API can be used to build a feed for a collection including sales, asks, transfers, mints, bids, cancelled bids, and cancelled asks types.
      parameters:
      - description: 'Filter to a particular collection with collection-id. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-convert:
          case: lower
        name: collection
        in: query
        schema:
          type: string
      - description: Filter to a particular collection set.
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - description: 'Filter to a particular attribute. Note: Our docs do not support this parameter correctly. To test, you can use the following URL in your browser. Example: `https://api.reservoir.tools/collections/activity/v6?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attribute[Type]=Original` or `https://api.reservoir.tools/collections/activity/v6?collection=0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63&attribute[Type]=Original&attribute[Type]=Sibling`'
        name: attributes
        in: query
        x-type: object
        schema:
          type: string
      - description: If true, will filter any activities marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any activities marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: Amount of items returned. Max limit is 50. defaults to **50**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      - description: Order the items are returned in the response. The blockchain event time is `eventTimestamp`. The event time recorded is `createdAt`. defaults to **eventTimestamp**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - eventTimestamp
          - createdAt
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
      - description: If true, metadata is included in the response. If true, max limit is 50. defaults to **true**
        name: includeMetadata
        in: query
        schema:
          type: boolean
      - x-alternatives:
        - type: array
          items:
            type: string
            enum:
            - ask
            - bid
            - mint
            - sale
            - ask_cancel
            - bid_cancel
            - transfer
            x-convert:
              case: lower
          collectionFormat: multi
          name: types
        - type: string
          enum:
          - ask
          - bid
          - mint
          - sale
          - ask_cancel
          - bid_cancel
          - transfer
          x-convert:
            case: lower
        name: types
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ask
            - bid
            - mint
            - sale
            - ask_cancel
            - bid_cancel
            - transfer
            x-convert:
              case: lower
      - description: Input any ERC20 address to return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Activity
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getCollectionActivityV6Response'
      x-order: 1
  /tokens/{token}/activity/v5:
    get:
      summary: Token activity
      operationId: getTokensTokenActivityV5
      description: This API can be used to build a feed for a token activity including sales, asks, transfers, mints, bids, cancelled bids, and cancelled asks types.
      parameters:
      - description: 'Filter to a particular token. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63:123`'
        x-convert:
          case: lower
        name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}:[0-9]+$
      - description: Amount of items returned. Default and max is 20. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
      - description: Order the items are returned in the response. The blockchain event time is `eventTimestamp`. The event time recorded is `createdAt`. defaults to **eventTimestamp**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - eventTimestamp
          - createdAt
      - description: If true, metadata is included in the response. defaults to **true**
        name: includeMetadata
        in: query
        schema:
          type: boolean
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
      - description: If true, will filter any activities marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any activities marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - x-alternatives:
        - type: array
          items:
            type: string
            enum:
            - ask
            - bid
            - mint
            - sale
            - ask_cancel
            - bid_cancel
            - transfer
            x-convert:
              case: lower
          collectionFormat: multi
          name: types
        - type: string
          enum:
          - ask
          - bid
          - mint
          - sale
          - ask_cancel
          - bid_cancel
          - transfer
          x-convert:
            case: lower
        name: types
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ask
            - bid
            - mint
            - sale
            - ask_cancel
            - bid_cancel
            - transfer
            x-convert:
              case: lower
      - description: Input any ERC20 address to return result in given currency
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Activity
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getTokenActivityV5Response'
      x-order: 1
  /users/activity/v6:
    get:
      summary: Users activity
      operationId: getUsersActivityV6
      description: This API can be used to build a feed for a user including sales, asks, transfers, mints, bids, cancelled bids, and cancelled asks types.
      parameters:
      - description: 'Array of users addresses. Max is 50. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
        x-alternatives:
        - type: array
          description: 'Array of users addresses. Max is 50. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          minItems: 1
          maxItems: 50
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          collectionFormat: multi
          name: users
        - type: string
          description: 'Array of users addresses. Max is 50. Example: `0x8d04a8c79ceb0889bdd12acdf3fa9d207ed3ff63`'
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        name: users
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            x-convert:
              case: lower
          minItems: 1
          maxItems: 50
      - x-alternatives:
        - type: array
          items:
            type: string
            x-convert:
              case: lower
          collectionFormat: multi
          name: collection
        - type: string
          x-convert:
            case: lower
        name: collection
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            x-convert:
              case: lower
      - description: If true, will filter any activities marked as spam. defaults to **false**
        name: excludeSpam
        in: query
        schema:
          type: boolean
      - description: If true, will filter any activities marked as nsfw. defaults to **false**
        name: excludeNsfw
        in: query
        schema:
          type: boolean
      - description: Filter to a particular collection set.
        x-convert:
          case: lower
        name: collectionsSetId
        in: query
        schema:
          type: string
      - description: Filter to a particular contracts set.
        x-convert:
          case: lower
        name: contractsSetId
        in: query
        schema:
          type: string
      - description: 'Filter to a particular community. Example: `artblocks`'
        x-convert:
          case: lower
        name: community
        in: query
        schema:
          type: string
      - x-alternatives:
        - type: array
          maxItems: 20
          items:
            type: string
          collectionFormat: multi
          name: mintStandard
        - type: string
        name: mintStandard
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 20
      - description: Amount of items returned in response. Max limit is 20. defaults to **20**
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      - description: Order the items are returned in the response. The blockchain event time is `eventTimestamp`. The event time recorded is `createdAt`. defaults to **eventTimestamp**
        name: sortBy
        in: query
        schema:
          type: string
          enum:
          - eventTimestamp
          - createdAt
      - description: If true, metadata is included in the response. defaults to **true**
        name: includeMetadata
        in: query
        schema:
          type: boolean
      - description: Use continuation token to request next offset of items.
        name: continuation
        in: query
        schema:
          type: string
      - x-alternatives:
        - type: array
          items:
            type: string
            enum:
            - ask
            - bid
            - mint
            - sale
            - ask_cancel
            - bid_cancel
            - transfer
            x-convert:
              case: lower
          collectionFormat: multi
          name: types
        - type: string
          enum:
          - ask
          - bid
          - mint
          - sale
          - ask_cancel
          - bid_cancel
          - transfer
          x-convert:
            case: lower
        name: types
        in: query
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ask
            - bid
            - mint
            - sale
            - ask_cancel
            - bid_cancel
            - transfer
            x-convert:
              case: lower
      - description: Input any ERC20 address to return result in given currency.
        x-convert:
          case: lower
        name: displayCurrency
        in: query
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      tags:
      - Activity
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getUserActivityV6Response'
      x-order: 1
components:
  schemas:
    Model123:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/Model121'
        collection:
          $ref: '#/components/schemas/Model122'
    Model122:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        isSpam:
          type: boolean
        isNsfw:
          type: boolean
    Model129:
      type: object
      properties:
        tokenId:
          type: string
        tokenName:
          type: string
        tokenImage:
          type: string
        isSpam:
          type: boolean
        isNsfw:
          type: boolean
        rarityScore:
          type: number
        rarityRank:
          type: number
    Model132:
      type: object
      properties:
        type:
          type: string
          description: 'Possible types returned: `ask`, `ask_cancel`, `bid`, `bid_cancel`, `sale`, `mint, and `transfer`.'
        fromAddress:
          type: string
        toAddress:
          type: string
        price:
          $ref: '#/components/schemas/Model128'
        amount:
          type: number
        timestamp:
          type: number
          description: Time when added on the blockchain.
        createdAt:
          type: string
          description: Time when added in the indexer.
        contract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        token:
          $ref: '#/components/schemas/Model129'
        collection:
          $ref: '#/components/schemas/Model130'
        txHash:
          type: string
          description: Txn hash from the blockchain.
          pattern: ^0x[a-fA-F0-9]{64}$
          x-convert:
            case: lower
        logIndex:
          type: number
        batchIndex:
          type: number
        fillSource:
          $ref: '#/components/schemas/source'
        isAirdrop:
          type: boolean
        comment:
          type: string
        order:
          $ref: '#/components/schemas/Model131'
    lastBuy:
      type: object
      properties:
        value:
          type: number
        timestamp:
          type: number
    Model276:
      type: object
      properties:
        type:
          type: string
          description: 'Possible types returned: `ask`, `ask_cancel`, `bid`, `bid_cancel`, `sale`, `mint, and `transfer`.'
        fromAddress:
          type: string
        toAddress:
          type: string
        price:
          $ref: '#/components/schemas/Model128'
        amount:
          type: number
        timestamp:
          type: number
          description: Time when added on the blockchain.
        contract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        token:
          $ref: '#/components/schemas/Model274'
        collection:
          $ref: '#/components/schemas/Model275'
        txHash:
          type: string
          description: Txn hash from the blockchain.
          pattern: ^0x[a-fA-F0-9]{64}$
          x-convert:
            case: lower
        logIndex:
          type: number
        batchIndex:
          type: number
        fillSource:
          $ref: '#/components/schemas/source'
        isAirdrop:
          type: boolean
        comment:
          type: string
        order:
          $ref: '#/components/schemas/Model131'
        createdAt:
          type: string
    currency:
      type: object
      properties:
        contract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: number
        chainId:
          type: number
    Model128:
      type: object
      description: Return native currency unless displayCurrency contract was passed.
      properties:
        currency:
          $ref: '#/components/schemas/currency'
        amount:
          $ref: '#/components/schemas/amount'
        netAmount:
          $ref: '#/components/schemas/netAmount'
    Model130:
      type: object
      properties:
        collectionId:
          type: string
        collectionName:
          type: string
        collectionImage:
          type: string
        isSpam:
          type: boolean
        isNsfw:
          type: boolean
    amount:
      type: object
      description: Amount with fees & royalties included.
      properties:
        raw:
          type: string
          pattern: ^-?[0-9]+$
        decimal:
          type: number
        usd:
          type: number
        native:
          type: number
    Model277:
      type: array
      items:
        $ref: '#/components/schemas/Model276'
    Model348:
      type: array
      items:
        $ref: '#/components/schemas/Model347'
    netAmount:
      type: object
      description: Amount with fees & royalties removed.
      properties:
        raw:
          type: string
          pattern: ^-?[0-9]+$
        decimal:
          type: number
        usd:
          type: number
        native:
          type: number
    Model275:
      type: object
      properties:
        collectionId:
          type: string
        collectionName:
          type: string
        collectionImage:
          type: string
        isSpam:
          type: boolean
          default: false
        isNsfw:
          type: boolean
          default: false
    Model124:
      type: object
      properties:
        kind:
          type: string
          enum:
          - token
        data:
          $ref: '#/components/schemas/Model123'
    Model346:
      type: object
      properties:
        collectionId:
          type: string
        collectionName:
          type: string
        collectionImage:
          type: string
        isSpam:
          type: boolean
          default: false
        isNsfw:
          type: boolean
    Model131:
      type: object
      properties:
        id:
          type: string
        side:
          type: string
          enum:
          - ask
          - bid
        source:
          $ref: '#/components/schemas/metadata'
        criteria:
          $ref: '#/components/schemas/Model124'
    getTokenActivityV5Response:
      type: object
      properties:
        continuation:
          type: string
        activities:
          $ref: '#/components/schemas/Model348'
    Model274:
      type: object
      properties:
        tokenId:
          type: string
        tokenName:
          type: string
        tokenImage:
          type: string
        isSpam:
          type: boolean
          default: false
        isNsfw:
          type: boolean
          default: false
        lastBuy:
          $ref: '#/components/schemas/lastBuy'
        lastSell:
          $ref: '#/components/schemas/lastBuy'
        tokenRarityScore:
          type: number
          description: No rarity for collections over 100k
        tokenRarityRank:
          type: number
          description: No rarity rank for collections over 100k
        tokenMedia:
          type: string
    Model121:
      type: object
      properties:
        tokenId:
          type: string
          pattern: ^-?[0-9]+$
        name:
          type: string
        image:
          type: string
        isSpam:
          type: boolean
        isNsfw:
          type: boolean
    getUserActivityV6Response:
      type: object
      properties:
        continuation:
          type: string
        activities:
          $ref: '#/components/schemas/Model277'
    source:
      type: object
      properties:
        id:
          type: string
        domain:
          type: string
        name:
          type: string
        icon:
          type: string
        url:
          type: string
    metadata:
      type: object
    getCollectionActivityV6Response:
      type: object
      properties:
        continuation:
          type: string
        activities:
          $ref: '#/components/schemas/Model133'
    Model133:
      type: array
      items:
        $ref: '#/components/schemas/Model132'
    Model347:
      type: object
      properties:
        type:
          type: string
          description: 'Possible types returned: `ask`, `ask_cancel`, `bid`, `bid_cancel`, `sale`, `mint, and `transfer`.'
        fromAddress:
          type: string
        toAddress:
          type: string
        price:
          $ref: '#/components/schemas/Model128'
        amount:
          type: number
        timestamp:
          type: number
          description: Time when added on the blockchain.
        createdAt:
          type: string
          description: Time when added in the indexer.
        contract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          x-convert:
            case: lower
        token:
          $ref: '#/components/schemas/Model129'
        collection:
          $ref: '#/components/schemas/Model346'
        txHash:
          type: string
          description: Txn hash from the blockchain.
          pattern: ^0x[a-fA-F0-9]{64}$
          x-convert:
            case: lower
        logIndex:
          type: number
        batchIndex:
          type: number
        fillSource:

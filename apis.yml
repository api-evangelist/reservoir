aid: reservoir

name: Reservoir

description: NFT marketplace infrastructure and data API for aggregating listings, bids, and sales across OpenSea, Blur, and other markets — powers
  buying, selling, and analytics across 30+ EVM chains. Reservoir provided a complete suite of APIs, SDKs, and UI kits abstracting the complexity
  of interacting with the NFT market. The service was sunset on October 15, 2025.

